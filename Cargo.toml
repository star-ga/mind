[package]
name = "mind"
version = "0.10.2"
edition = "2024"
rust-version = "1.85"
authors = ["STARGA Inc."]
description = "The native language for intelligent systems"
repository = "https://github.com/star-ga/mind"
homepage = "https://github.com/star-ga/mind"
documentation = "https://github.com/star-ga/mind/tree/main/docs"
readme = "README.md"
license = "Apache-2.0"
default-run = "mind"
keywords = ["ai", "machine-learning", "compiler", "tensor", "autodiff"]
categories = ["compilers", "science"]
exclude = ["assets/", "benchmarks/", "examples/"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
anyhow = "1.0"
thiserror = "1.0"
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = { version = "6", optional = true }
tempfile = "3"
fs2 = "0.4.3"
toml = "0.8"
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"], optional = true }
sha2 = { version = "0.10", optional = true }
dirs = "5"
pyo3 = { version = "0.29", optional = true, features = ["extension-module"] }
# Post-quantum ML-DSA (FIPS-204) signing for the evidence chain (RFC 0021 §6).
# OPTIONAL + off by default so the default compiler build keeps its minimal
# dependency surface and the determinism/keystone gate never compiles it. This
# is a vetted, pure-Rust FIPS-204 implementation (integritychain/fips204) — we do
# NOT reimplement the lattice math. `default-features = false` drops the OS-RNG
# path: signing is fully deterministic via keygen_from_seed + try_sign_with_seed.
# ml-dsa-65 = the shipped hybrid's lattice leg + historical-artifact verify.
# ml-dsa-87 (cat-5) = the lattice leg of the bulletproof PQC-hybrid (RFC 0016
# max-security profile). Both parameter sets from the same vetted crate.
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"], optional = true }
# SLH-DSA (SPHINCS+, FIPS-205) — the hash-based leg of the bulletproof PQC-hybrid.
# Same vetted-crate policy as fips204: pure-Rust integritychain impl, we do NOT
# reimplement the hash-tree math. default-features = false drops the OS-RNG path;
# only slh_dsa_shake_256s (cat-5, small-signature — right for offline low-cadence).
# Signing is deterministic via keygen_with_seeds + try_sign(hedged = false).
fips205 = { version = "0.4.1", default-features = false, features = ["slh_dsa_shake_256s"], optional = true }
# fips205's deterministic sign is exposed only via `try_sign_with_rng`; with
# hedged = false the RNG is never read (opt_rand = PK.seed), so we feed it a
# zero RNG. rand_core 0.6.4 matches fips205's own pin — one crate, no duplicate.
rand_core = { version = "0.6.4", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
which = "6"
libloading = "0.8"
sha2 = "0.10"

[lib]
name = "libmind"
crate-type = ["cdylib", "rlib"]
# `bench = false` on the lib and the two bins so a bare `cargo bench` selects ONLY
# the criterion targets below. Without it cargo runs the libtest harness first,
# which rejects criterion's own flags — the documented CI-equivalent sweep
# (`cargo bench --no-default-features -- --output-format bencher --measurement-time 8`)
# died on "error: Unrecognized option: 'output-format'" after a 9-minute build,
# having benchmarked nothing. There are no `#[bench]` functions in the lib or bins,
# so nothing is lost; every per-target invocation (`--bench compiler`, etc.) is
# unaffected.
bench = false

[[bin]]
name = "mind"
path = "src/main.rs"
bench = false

[[bin]]
name = "mindc"
path = "src/bin/mindc.rs"
bench = false

# Declared only to carry `bench = false`; it would otherwise be auto-discovered
# from src/bin/ with bench = true and stall the sweep the same way.
[[bin]]
name = "mind-ai"
path = "src/bin/mind-ai.rs"
bench = false

# The statement-keyword recogniser equivalence/determinism gate exercises the
# std-surface-gated statements (while / loop / region / break / continue), so it
# only builds meaningfully with `std-surface`. Declared explicitly with
# `required-features` so `cargo test --no-default-features` (a CI job) skips it
# instead of compiling a build where those keywords fall through to the
# expression path and the equivalence assertions fail.
[[test]]
name = "stmt_keyword_recognizer"
required-features = ["std-surface"]

# The declared-width evaluator fixture uses the std-surface-gated `while`
# statement. Keep it out of `--no-default-features` jobs, where the parser
# intentionally does not recognize that statement; the std-surface CI run
# executes the full eight-test target.
[[test]]
name = "evaluator_declared_width"
required-features = ["std-surface"]

# The G2 differential gate drives the pure-MIND compiler through its cdylib and
# compares it against the Rust oracle, both of which exist only under
# `mlir-build`. Without the feature the harness still COMPILES and RUNS, finds no
# oracle, and reports a skip — a gate that executed and asserted nothing. Declared
# explicitly so `cargo test --no-default-features` never builds it, making the
# absence structural (cargo skips the target) rather than a tolerated runtime skip.
[[test]]
name = "g2_differential_mlir"
required-features = ["mlir-build"]

# The #72 cross-substrate determinism fuzzer drives `mindc --emit-shared`, which
# errors with "requires building with the 'mlir-build' feature" without it — so in
# any other feature combo EVERY generated program fails identically, for a reason
# that has nothing to do with the program. Its own header (line 81) already says to
# build it with `mlir-build std-surface cross-module-imports`; this makes that a
# declaration cargo enforces rather than a comment. Same reasoning as the sibling
# gate above: structural absence (cargo skips the target) beats a target that is
# built and then guaranteed to fail. Measured: the executable-semantics tier ran it
# under `std-surface,mlir-lowering` and counted the resulting panic as a real
# lowering failure.
[[test]]
name = "mindfuzz_cross_substrate"
required-features = ["mlir-build"]

# The TurboQuant kernel gate builds and RUNS bench/turboquant.mind, so it needs the
# emission path `mlir-build` provides. Declared rather than left to a runtime skip,
# for the same reason as the two gates above.
[[test]]
name = "turboquant_kernel_run"
required-features = ["mlir-build"]

# Order-symmetry of merge signedness. Needs std-surface: ScalarU64/ScalarU32 do not
# exist without it, so the property under test is unreachable in a default build.
[[test]]
# Drives the `mindc` binary end-to-end, so it needs the full surface the guards live on.
name = "fail_closed_cli_run"
required-features = ["std-surface", "mlir-build"]

[[test]]
# Drives the `mindc` binary through native linked-project build/run paths. Keep
# the target structurally absent when its compiler and cross-module surfaces are
# unavailable; compiling it with a cfg that removes every test would report a
# false-green zero-test pass.
name = "build_run_runnable_blocker_gate"
required-features = ["std-surface", "mlir-build", "cross-module-imports"]

[[test]]
name = "public_cpu_native_link"
required-features = ["mlir-build"]

[[test]]
name = "issue_235_single_file_import"
required-features = ["mlir-build", "cross-module-imports"]

# `mindc test` import execution needs the manifest-bounded module resolver.
# Keep the gate structurally absent when that language surface is not built.
[[test]]
name = "mindc_test_imports"
required-features = ["cross-module-imports"]

[[test]]
name = "source_confinement"
required-features = ["cross-module-imports"]

[[test]]
# Owner-preserving source-function resolution is compiled only with the
# project module table; keep this target structurally absent otherwise.
name = "project_function_resolution"
required-features = ["cross-module-imports"]

[[test]]
name = "merge_kind_order_symmetry"
# BOTH features are load-bearing, and declaring only one broke the required `build_test`
# job. `std-surface` is what makes ScalarU64/ScalarU32 exist at all -- without it the
# property under test is unreachable. `mlir-build` is what makes the test's own harness
# work: it shells out to `mindc --emit-mlir`, which errors with "MLIR emission requires
# building with the 'mlir-lowering' or 'mlir-build' feature" (src/bin/mindc.rs:1793)
# otherwise, so every fixture would fail to emit and the test would fail for a reason
# that has nothing to do with merge signedness.
required-features = ["std-surface", "mlir-build"]

[[test]]
name = "issue_246_bitnot_operator"
required-features = ["std-surface"]

[[test]]
name = "mindcraft_lint_q16_overflow"
required-features = ["std-surface"]

[[test]]
name = "nerve_numerics_lint"
required-features = ["std-surface"]

[[bench]]
name = "compiler"
harness = false

[[bench]]
name = "shapes"
harness = false

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "autodiff"
harness = false
required-features = ["autodiff"]

[[bench]]
name = "cross_module"
harness = false
required-features = ["cross-module-imports"]

[[bench]]
name = "std_surface"
harness = false
required-features = ["std-surface", "mlir-lowering"]

[[bench]]
name = "simple_benchmarks"
harness = false

# Parse-only throughput over the real self-host source. Separate target from
# `compiler` on purpose: tools/bench_gate.py freezes `--bench compiler`, so a
# new measurement instrument here cannot perturb the frozen baseline.
[[bench]]
name = "parser_throughput"
harness = false
required-features = ["std-surface"]

[[bench]]
name = "cerebras_stencil"
harness = false

[[bench]]
name = "mindcraft_fmt"
harness = false

[[bench]]
name = "fft_q16"
harness = false

[[bench]]
name = "det_matmul_q16"
harness = false

[[bench]]
name = "det_matmul_q16_mt"
harness = false

[[bench]]
name = "det_gemv_q16_mt"
harness = false

[[bench]]
name = "det_matmul_i16"
harness = false

[[bench]]
name = "det_matmul_i8"
harness = false

# Crypto / protocol primitive throughput benches (the provable HTTP stack).
[[bench]]
name = "bench_sha256"
harness = false

[[bench]]
name = "bench_keccak"
harness = false

[[bench]]
name = "bench_aes_gcm"
harness = false

[[bench]]
name = "bench_hkdf"
harness = false

[[bench]]
name = "bench_x25519"
harness = false

[[bench]]
name = "bench_mlkem768"
harness = false

[[bench]]
name = "bench_rsa_pss"
harness = false

[[bench]]
name = "bench_ecdsa_p256"
harness = false

[[bench]]
name = "bench_x509"
harness = false

[[bench]]
name = "bench_hpack"
harness = false

[[bench]]
name = "bench_http2_frame"
harness = false

[[bench]]
name = "bench_tls13_record"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
# Reduce codegen units to prevent LNK1318 (too many PDB files) on Windows
codegen-units = 16
split-debuginfo = "packed"

[profile.test]
inherits = "dev"
# Disable debug info for tests to avoid Windows LNK1318 PDB errors
codegen-units = 1
debug = false

[features]
# Stage 2 — promote the high-level surface to default. `std-surface` carries the
# 10 verified-executing bricks (match/enum/Option/String/struct-field/method-as-
# field/method-with-args-UFCS); the unpromoted constructs (aggregate Tuple
# returns, region{}) are re-gated behind `std-surface-experimental` and FAIL LOUD
# by default (never silent const-0). Keystone byte-identity is preserved: the
# keystone test always builds with `std-surface` explicitly, so this flip changes
# zero keystone bytes. `--no-default-features` restores the low-level-only subset.
default = ["std-surface"]
autodiff = []
# Compile-time phase instrumentation. OFF by default and fully cfg-gated, so
# the frozen frontend criterion baselines and the bit-identity hot path incur
# ZERO cost — the timing code does not exist in a default build. Build with
# `--features compile-timings` and set `MIND_TIMINGS=1` to print a per-phase
# waterfall (parse / typecheck / ir-lower / verify+canon) to stderr.
compile-timings = []
cpu-buffers = []
cpu-exec = ["cpu-buffers"]
cpu-conv = ["cpu-exec"]
mlir = []
mlir-lowering = []
# mlir_backend / llvm: removed 2026-05-21. The melior + inkwell crates
# were declared optional but never imported by any compiled code (the
# production codegen path emits MLIR text and shells to mlir-opt/llc/clang
# subprocesses — see docs/mindcraft/rfc0010-phase-ghi-migration-plan.md §0).
mlir-subprocess = ["which"]
mlir-exec = ["mlir-subprocess"]
mlir-jit = ["libloading"]
mlir-gpu = []
mlir-build = ["mlir-subprocess"]
ffi-c = ["libc"]
ffi-c-user = []  # RFC 0002 deliverable 2+: emit `mind_fn_<name>_invoke` C-ABI wrappers for IRModule.exports
# `cross-module-imports` bundles the real std/*.mind sources (see
# src/project/stdlib.rs) and parses them at resolve time. Those sources are
# written in the std-surface language (`while`, `region`, …), whose parser
# arms are gated behind `std-surface`. Resolving the bundled stdlib therefore
# requires the std-surface parser — without the dependency, 7 of the 15
# bundled modules silently fail to parse under a cross-module-imports-only
# build. Both features stay non-default, so the default-build byte-identity
# hot path is untouched.
cross-module-imports = ["std-surface"]  # Phase 10.6 item 9 / Phase 15: `use crate::x::y` module table + resolver
std-surface = []  # RFC 0005 Phase 0: generic Instr::Call -> MLIR func.call lowering (i64 ABI)
# Per-construct std-surface promotion (Stage 0a). The 10 promoted std bricks
# stay under `std-surface`. The UNPROMOTED constructs — genuine collapsing
# aggregate (tuple) returns, type-variable generics, and `region { }` — are
# re-gated behind this experimental flag. Under a plain `std-surface` build
# those constructs FAIL LOUD at lowering (a clear compile error, never a
# silent const-0/i64 collapse). Enabling this flag restores the prior
# best-effort lowering for them. `default` stays `[]`; the bit-identity hot
# path is untouched.
std-surface-experimental = ["std-surface"]
ffi-examples = []
# Post-quantum evidence-chain signing (RFC 0021 §6). Enables ML-DSA-65 (FIPS-204)
# and the hybrid ed25519+ML-DSA scheme in `mindc build --emit-evidence` and
# `mindc verify`. OFF by default: the classical ed25519 layer is always available
# (hand-rolled, zero deps); ML-DSA pulls the optional `fips204` crate. The
# determinism/keystone gate builds WITHOUT this feature, so the trace_hash anchor
# is untouched (signatures are metadata after the MAP sentinel).
evidence-mldsa = ["fips204"]
# Bulletproof PQC-hybrid hash-based leg (SLH-DSA-SHAKE-256s, FIPS-205). OFF by
# default like evidence-mldsa — the determinism/keystone gate never compiles it.
# The full max-security scheme is evidence-mldsa + evidence-slhdsa together.
evidence-slhdsa = ["dep:fips205", "dep:rand_core"]
pkg = ["tar", "flate2", "sha2"]
registry = []
python-bindings = ["pyo3"]
aot = ["mlir-build", "mlir-lowering", "autodiff"]
full = ["aot", "autodiff", "cpu-exec", "cpu-conv", "pkg", "ffi-c"]

[build-dependencies]
cc = "1"
