name: qemu-user
description: "Install qemu-user (the value-shape gate's Westmere / Haswell runner) when qemu-x86_64 is not on PATH."
# native_lane_value_shapes_smoke.py runs its ISA rows under `qemu-x86_64 -cpu Westmere | Haswell | qemu64`:
# no AVX gives the scalar path and the ISA guard's exit 132. The gate is BLOCKED (exit 2) when that runner is
# absent. The gate resolves QEMU_X86_64, else PATH, else /usr/local/bin/qemu-x86_64. The rows were recorded with
# QEMU 8.2.2, the Ubuntu 24.04 package. The last line runs the tool with no pipe, so an absent runner fails by name.
# A composite action keeps the workflow file from growing (no-god-files order).
runs:
  using: composite
  steps:
    - shell: bash -e {0}
      run: |
        if ! command -v qemu-x86_64 >/dev/null; then
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y --no-install-recommends qemu-user
        fi
        qemu-x86_64 --version
