name: Release

# Publishes the five platform binaries that everyone downloads as "MIND".
#
# WHAT MAY BE RELEASED
# --------------------
# Exactly one thing: a commit that an EXISTING tag already points at, and that a
# completed `ci.yml` run has proven green on every gate named in
# .github/required-ci-jobs.tsv.
#
# This workflow deliberately owns no gates of its own and creates no refs of its
# own. It used to do the opposite: `release` gated on `needs: build` alone, and
# the build job's whole step list was Checkout / Install Rust / Cache / Install
# cross / Build / Package / Upload — no test, no keystone, no cross-substrate
# identity. Because CI lives in a separate workflow with no `tags:` trigger,
# nothing about a tag push ever started those gates, so binaries could be
# published from a commit whose CI was red, skipped by `paths-ignore`, or never
# run. The `workflow_dispatch` path was worse: it took a free-text `version` and
# minted `v$version` at whatever branch it was dispatched on, publishing a
# non-draft release from a commit that need never have been reviewed or merged.
#
# Both holes are now closed by the `gate` job below, and both are asserted
# statically by scripts/check_release_gating.py so they cannot silently reopen.
#
# HOW TO CUT A RELEASE
# --------------------
#   1. Land the change on main and let CI go green on that commit.
#   2. `git tag -a vX.Y.Z <that commit> && git push origin vX.Y.Z`
#      (a human pushes the tag; this workflow never will).
#   3. The tag push runs this workflow. To repeat it, re-run that run
#      (`gh run rerun <run-id>`): a re-run keeps the tag as its ref.
#
# The tag push is the ONLY trigger. There is deliberately no workflow_dispatch:
# a dispatch runs in the cache scope of the branch it is dispatched on (main,
# by default), so the build steps below would execute the tagged commit with a
# runtime token that can write main's cache, and every later main run would
# restore what it wrote. A tag-push run is scoped to the tag alone.
#
# If the gate blocks with "no ci.yml run exists for commit ...", the commit was
# skipped by ci.yml's `paths-ignore`. Dispatch CI on that ref, wait for green,
# then re-run this workflow. Do not work around the gate.
#
# deferred: two last-mile controls live in repo SETTINGS, not in this file, and
# are NOT in place today (`gh api repos/star-ga/mind/rulesets` -> [],
# `.../tags/protection` -> 404):
#   (a) a tag-protection ruleset on `v*`, so only maintainers can create the ref
#       this workflow is willing to publish;
#   (b) required reviewers on the `release` environment referenced by the
#       publish job below — referencing an unconfigured environment is a no-op,
#       so it is a hook for that protection, not the protection itself.
# Until (a) exists, this workflow's guarantee is "the released commit is CI-green
# and the ref pre-existed", NOT "the ref was created by an authorized human".
#
# The same bound explains why ci.yml deliberately did NOT gain a `tags:` trigger:
# a run started by the tag push would still be in flight when this workflow asks,
# and "wait for it" is weaker than "it was already green before the tag existed".
# It also bounds what this gate can prove about ITSELF — on a tag push GitHub runs
# the workflow file, the verifier, and the manifest as they exist at the released
# ref, so a commit that rewrites them is checked by its own rewritten rules. That
# floor is (a)'s job, not a script's; no in-workflow check can rise above the ref
# that triggered it.

on:
  push:
    tags:
      - 'v*'

# Read-only by default. `contents: write` is granted to the publishing job alone,
# so the five build runners never hold a token that could push a ref.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  gate:
    name: Verify release commit is CI-green
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read   # list workflow runs + their jobs for the release commit
      checks: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release gating contract (static)
        # Asserts the properties this file is supposed to have — no self-minted
        # tags, publish + build both behind this gate, a tag push as the only
        # trigger, write scoped to the publisher, and required-ci-jobs.tsv still in
        # agreement with ci.yml. Runs first: if the contract itself has drifted,
        # nothing downstream is trustworthy.
        run: python3 scripts/run_gate.py scripts/check_release_gating.py

      - name: Resolve tag and require a green CI run for that exact commit
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # The tag is the sole source of the release name and version, so a
          # malformed one must stop here rather than produce a garbage release.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "RELEASE BLOCKED: tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]." >&2
            exit 1
          fi

          # Fails closed on: tag absent, no CI run for the commit, run red, run
          # still in flight, run from a fork, pull_request-event run (which tests
          # a merge commit, not this tree), a missing required gate, or a red
          # sibling workflow. See scripts/verify_ci_green.py.
          # 2>&1 keeps the verdict and the per-gate table in ONE stream: `tee`
          # buffers stdout, so a stderr-only verdict lands out of order in the
          # Actions log. pipefail (set above) is what makes a failing verifier
          # fail this step rather than tee's exit code passing it.
          # run_gate-exempt: scripts/verify_ci_green.py - it queries the live GitHub
          # check-runs API for the tag under release, so its verdict is about a
          # remote run, not about anything in this tree; and the step consumes its
          # STDOUT (`sed -n 's/^sha=//p' /tmp/gate.log`), which routing through a
          # runner that re-emits the stream would put at risk for no added guarantee.
          python3 scripts/verify_ci_green.py --repo "$GITHUB_REPOSITORY" --ref "$TAG" 2>&1 | tee /tmp/gate.log

          SHA=$(sed -n 's/^sha=//p' /tmp/gate.log)
          if [ -z "$SHA" ]; then
            echo "RELEASE BLOCKED: gate produced no commit sha." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # LINUX GLIBC FLOOR. A Linux binary needs the newest glibc symbol version
        # it was linked against. Built directly on ubuntu-24.04, the v0.10.2 asset
        # needed GLIBC_2.39 and did not start on Ubuntu 22.04, Debian 11/12 or
        # RHEL 8/9. The Linux legs therefore compile inside `image`, a glibc 2.28
        # build image pinned by digest (never a tag), and the glibc-floor smoke
        # fails the leg when the binary needs a symbol newer than `glibc_floor`.
        # It then runs the binary in `floor_image`, a minimal glibc 2.28 system
        # with no compiler, linker, LLVM or MLIR. ci.yml release_profile carries
        # the same three values per target; check_release_gating.py R8 fails on
        # any drift. Bump an image digest deliberately, never to a newer floor
        # without a written decision.
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Linux x86_64
            artifact: mindc-linux-x64
            ext: tar.gz
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
            glibc_floor: "2.28"
            floor_image: docker.io/library/almalinux:8.10-minimal@sha256:3f9b9fdb5957745afcc9269e82c8c43e3140ab8802172967927070c5bc8be907
          # Native arm64 runner, the class ci.yml's cross_substrate_identity and
          # release_profile jobs already use. The leg used to cross-compile with
          # `cross` on an x86 runner, so the shipped aarch64 binary was never run
          # before publication; built natively, the post-build smoke below runs it.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux ARM64
            artifact: mindc-linux-arm64
            ext: tar.gz
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
            glibc_floor: "2.28"
            floor_image: docker.io/library/almalinux:8.10-minimal@sha256:3f9b9fdb5957745afcc9269e82c8c43e3140ab8802172967927070c5bc8be907
          - os: macos-26
            target: x86_64-apple-darwin
            name: macOS x86_64
            artifact: mindc-macos-x64
            ext: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            name: macOS ARM64
            artifact: mindc-macos-arm64
            ext: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            name: Windows x86_64
            artifact: mindc-windows-x64
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact commit the gate verified, not whatever the ref
          # resolves to now.
          ref: ${{ needs.gate.outputs.sha }}

      # The Linux legs install their toolchain inside the pinned build image
      # (the Build (Linux) step below); a toolchain on the runner would link
      # against the runner's newer glibc.
      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # No actions/cache here: a shipped binary is built from a clean target
      # and registry, so a cache entry written by any other run (including a
      # pull-request run on the default branch) cannot reach a release.

      # Ship a REAL compiler, not a check/parse-only binary: enable the MLIR
      # codegen + autodiff + bundled-stdlib features.
      #
      # evidence-mldsa + evidence-slhdsa are enabled here DELIBERATELY. The chosen
      # signing scheme is the post-quantum hybrid `pqc-hybrid-ml-dsa-87-slh-dsa-256s`
      # (ML-DSA-87 FIPS-204 + SLH-DSA-SHAKE-256s FIPS-205, both legs required).
      # Ed25519 is a dropped legacy tag, deliberately absent from that scheme. Without
      # these two features a released binary can ONLY sign with the dropped algorithm
      # and FAILS CLOSED on the scheme we actually chose — i.e. the shipped compiler
      # could not do the thing the docs say it does. Both are pure-Rust crates
      # (fips204, fips205) needing no extra build-time toolchain. They do NOT affect
      # the determinism wedge: signatures are metadata after the MAP sentinel, an
      # unsigned artifact stays byte-identical, and the keystone/byte-identity gate
      # still builds WITHOUT them.
      # These are pure-Rust additions
      # (the codegen emits MLIR text and shells out to mlir-opt/mlir-translate/clang
      # at RUNTIME), so no extra build-time toolchain is needed on the release
      # runners. `--emit-mlir`/`--emit-ir`/`check` work standalone; `--emit-shared`/
      # `--emit-obj` require the LLVM/MLIR tools on the user's PATH (documented in
      # docs/install.md) and fail with a clear "tool not found" error if absent.
      #
      # `--locked`: the dependency set is the committed Cargo.lock that CI tested
      # (ci.yml release_profile builds this exact command before any tag), not
      # whatever the newest semver-compatible crypto crates are on tag day.
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin mindc --features "mlir-lowering mlir-build cross-module-imports autodiff evidence-mldsa evidence-slhdsa"

      # The same cargo build, run inside the pinned glibc 2.28 build image, so the
      # shipped binary links against glibc 2.28 and not the runner's glibc. The
      # toolchain is installed in the image from the official rustup-init, checked
      # against its published sha256, on the same `stable` channel the other legs
      # use. CARGO_NET_OFFLINE passes through only when the caller sets it (an
      # offline reproduction with a pre-filled CARGO_HOME). ci.yml release_profile
      # runs this step verbatim on every PR.
      - name: Build (Linux, inside the pinned glibc-floor build image)
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home -e CARGO_HOME=/tmp/home/.cargo -e RUSTUP_HOME=/tmp/home/.rustup \
            -e CARGO_TERM_COLOR -e CARGO_REGISTRIES_CRATES_IO_PROTOCOL -e CARGO_NET_OFFLINE \
            -v "$PWD:/src" -w /src "$IMAGE" bash -euo pipefail -c "$(cat <<'IN_IMAGE'
          if [ ! -x "$CARGO_HOME/bin/rustc" ]; then
            base="https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu"
            curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init "$base/rustup-init"
            want=$(curl --proto '=https' --tlsv1.2 -sSf "$base/rustup-init.sha256" | cut -d' ' -f1)
            echo "$want  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "build image glibc: $(getconf GNU_LIBC_VERSION)"
          rustc -V
          cargo build --release --locked --target ${{ matrix.target }} --bin mindc --features "mlir-lowering mlir-build cross-module-imports autodiff evidence-mldsa evidence-slhdsa"
          IN_IMAGE
          )"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact }}.${{ matrix.ext }} mindc
          cd ../../..
          if command -v sha256sum &> /dev/null; then
            sha256sum ${{ matrix.artifact }}.${{ matrix.ext }} > ${{ matrix.artifact }}.${{ matrix.ext }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }}.${{ matrix.ext }} > ${{ matrix.artifact }}.${{ matrix.ext }}.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target\${{ matrix.target }}\release
          7z a ..\..\..\${{ matrix.artifact }}.${{ matrix.ext }} mindc.exe
          cd ..\..\..
          $hash = (Get-FileHash ${{ matrix.artifact }}.${{ matrix.ext }} -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "${{ matrix.artifact }}.${{ matrix.ext }}.sha256" -Value "$hash  ${{ matrix.artifact }}.${{ matrix.ext }}"

      # Post-build smoke on what ships: the .sha256 file verifies, the archive
      # unpacks, and `mindc --version` prints exactly the tag's version. A leg
      # that fails here uploads nothing, so the release job never publishes.
      # The same action runs in ci.yml's release_profile job on every PR.
      - name: Post-build smoke (checksum, unpack, --version == tag)
        id: smoke
        uses: ./.github/actions/release-artifact-smoke
        with:
          archive: ${{ matrix.artifact }}.${{ matrix.ext }}
          version: ${{ needs.gate.outputs.version }}

      # Fails the leg (so nothing is published) when the shipped binary needs a
      # glibc symbol newer than the floor or links any library outside glibc and
      # libgcc_s, or when it does not run `--version` and a native-backend
      # hello-world build + run inside the floor-glibc image.
      - name: Glibc-floor smoke (max GLIBC symbol <= floor, runs on the floor)
        id: floor
        if: runner.os == 'Linux'
        uses: ./.github/actions/glibc-floor-smoke
        with:
          binary: ${{ steps.smoke.outputs.binary }}
          glibc-floor: ${{ matrix.glibc_floor }}
          floor-image: ${{ matrix.floor_image }}

      # The build environment of record for the release notes: the digest-pinned
      # image this leg compiled in, and what the floor smoke measured.
      - name: Record the Linux build environment
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
          FLOOR: ${{ matrix.glibc_floor }}
          GLIBC_MAX: ${{ steps.floor.outputs.glibc_max }}
        run: |
          set -euo pipefail
          printf 'image=%s\nglibc_floor=%s\nglibc_max=%s\n' "$IMAGE" "$FLOOR" "$GLIBC_MAX" \
            > ${{ matrix.artifact }}.build-env.txt
          cat ${{ matrix.artifact }}.build-env.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.${{ matrix.ext }}
            ${{ matrix.artifact }}.${{ matrix.ext }}.sha256
            ${{ matrix.artifact }}.build-env.txt

  release:
    name: Create Release
    needs: [gate, build]
    runs-on: ubuntu-24.04
    # The only job holding a write token, and the only place to attach required
    # reviewers (see the `deferred:` note at the top of this file).
    permissions:
      contents: write
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # The notes are composed from the verified commit plus what each Linux leg
      # recorded: the digest-pinned build image it compiled in and the glibc
      # floor it was checked against. A Linux leg without that record stops the
      # release here, so the notes never name an image that did not build it.
      - name: Compose release notes
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## MIND Compiler v${{ needs.gate.outputs.version }}

          The native language for intelligent systems.

          Built from `${{ needs.gate.outputs.sha }}`, verified CI-green on every
          gate in `.github/required-ci-jobs.tsv` before this release was cut.

          ### Downloads

          | Platform | Architecture | File |
          |----------|--------------|------|
          | Linux | x86_64 | `mindc-linux-x64.tar.gz` |
          | Linux | ARM64 | `mindc-linux-arm64.tar.gz` |
          | macOS | Intel | `mindc-macos-x64.tar.gz` |
          | macOS | Apple Silicon | `mindc-macos-arm64.tar.gz` |
          | Windows | x86_64 | `mindc-windows-x64.zip` |

          ### Quick Install

          ```bash
          # Linux/macOS
          curl -LO https://github.com/star-ga/mind/releases/download/v${{ needs.gate.outputs.version }}/mindc-linux-x64.tar.gz
          tar -xzf mindc-linux-x64.tar.gz
          sudo mv mindc /usr/local/bin/
          mindc --version
          ```

          ### Linux compatibility

          The Linux binaries need glibc 2.28 or newer (for example RHEL, AlmaLinux
          or Rocky Linux 8+, Debian 10+, Ubuntu 20.04+, Fedora 29+, Amazon Linux
          2023). Each one is built inside the build image below, pinned by digest.
          Before upload it is checked to need no glibc symbol newer than the floor
          and no shared library other than glibc and libgcc_s, and it is run on a
          minimal glibc 2.28 system that has no compiler, linker, LLVM or MLIR.

          | File | Build image (pinned by digest) | glibc floor | Newest glibc symbol needed |
          |------|--------------------------------|-------------|----------------------------|
          NOTES
          for leg in mindc-linux-x64 mindc-linux-arm64; do
            env_file="artifacts/$leg.build-env.txt"
            test -s "$env_file" || { echo "RELEASE BLOCKED: $env_file is missing: the $leg leg recorded no build image."; exit 1; }
            image=$(sed -n 's/^image=//p' "$env_file")
            floor=$(sed -n 's/^glibc_floor=//p' "$env_file")
            max=$(sed -n 's/^glibc_max=//p' "$env_file")
            printf '%s\n' "$image" | grep -Eq '@sha256:[0-9a-f]{64}$' || { echo "RELEASE BLOCKED: $leg build image '$image' is not pinned by digest."; exit 1; }
            test -n "$floor" && test -n "$max" || { echo "RELEASE BLOCKED: $env_file has no glibc floor or measured maximum."; exit 1; }
            printf '| `%s.tar.gz` | `%s` | %s | GLIBC_%s |\n' "$leg" "$image" "$floor" "$max" >> release-notes.md
          done
          printf '\n---\n**MIND Language**: https://github.com/star-ga/mind\n' >> release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The tag already exists and already points at the verified commit —
          # this step attaches a release to it and never creates a ref.
          tag_name: ${{ needs.gate.outputs.tag }}
          name: MIND Compiler v${{ needs.gate.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/mindc-linux-x64.tar.gz
            artifacts/mindc-linux-x64.tar.gz.sha256
            artifacts/mindc-linux-arm64.tar.gz
            artifacts/mindc-linux-arm64.tar.gz.sha256
            artifacts/mindc-macos-x64.tar.gz
            artifacts/mindc-macos-x64.tar.gz.sha256
            artifacts/mindc-macos-arm64.tar.gz
            artifacts/mindc-macos-arm64.tar.gz.sha256
            artifacts/mindc-windows-x64.zip
            artifacts/mindc-windows-x64.zip.sha256
          body_path: release-notes.md
