name: Cargo Deny
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: 0
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-deny binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-cargo-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.16-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version "^0.16"

      - name: Run cargo-deny with CVSS v4 sanitization
        # run_gate-exempt: tools/cargo-deny-sanitize.sh - a thin argv wrapper around
        # `cargo deny`; the advisory/licence verdict and its counts are cargo-deny's,
        # published in its own format, and the wrapper asserts nothing of its own.
        run: ./tools/cargo-deny-sanitize.sh check
