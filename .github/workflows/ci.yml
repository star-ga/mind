            echo "=== $s ==="
            if MINDC_SO=/tmp/libmindc_mind_self_host.so \
               MINDC_BIN="${{ github.workspace }}/target/release/mindc" \
               MINDC="${{ github.workspace }}/target/release/mindc" \
                 python3 scripts/run_gate.py "examples/mindc_mind/$s.py" | tee /tmp/wire_out.txt; then
              # Fail-closed: a "SKIP <so> not built" line exits 0 and would grade
              # a MISSING library as a pass. MINDC_SO is set and verified
              # non-empty above, so a SKIP here means the wiring broke, not that
              # the gate is inapplicable.
              # Anchored to column 0, `^SKIP` missed every INDENTED skip line
              # ("  SKIP  <check> unavailable", "  SKIPPED") that a multi-leg
              # smoke prints when only one leg opts out -- the backstop against
              # vacuous green had a hole in exactly the shape it exists to catch.
              # Leading whitespace is now allowed; the prefix still covers
              # SKIP/SKIPPED, and no passing smoke in these lists prints a
              # SKIP-prefixed line.
              if grep -qE '^[[:space:]]*SKIP' /tmp/wire_out.txt; then
                echo "ERROR: $s SKIPped with MINDC_SO set — vacuous green, failing closed"
                fail=1
              fi
            else
              echo "ERROR: $s FAILED"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
        working-directory: ${{ github.workspace }}

      - name: Native-ELF byte-identity canary rungs (one verdict per leg)
        # The rungs whose emitted bytes are compared against a COMMITTED
        # cross-substrate canary hash (or, for scalar_f32, against a
        # single-precision oracle). Each reports FOUR legs -- the self-host `.so`
        # exports the rung, the emitted image is a runnable ELF, the run produced
        # exactly the expected number of stdout bytes, and those bytes match the
        # canary -- as one `[PASS]`/`[FAIL]` verdict line apiece, so
        # scripts/gate_assert.py counts the work actually done.
        #
        # `--min-asserted 4` is what makes that count load-bearing: before this
        # step existed the same gates published `asserted=1` on every green run
        # (one unconditional `ALL PASS` summary), so DELETING a leg's check left
        # both the count and the verdict unchanged and the runner's floor could
        # only ever assert "something ran". Four is the leg count these gates
        # share; scalar_f32 reports five (its f32 value and its truncation are
        # separate oracle comparisons) and clears the same floor. A gate that
        # loses a leg now fails HERE rather than riding green.
        #
