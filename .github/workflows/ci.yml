            sha256_hash_smoke \
            struct_fields_smoke \
            struct_lit_smoke \
            unified_dispatch_smoke \
            validate_real_fns_smoke \
            while_struct_smoke; do
            echo "=== $s ==="
            if MINDC_SO=/tmp/libmindc_mind_self_host.so \
               MINDC_BIN="${{ github.workspace }}/target/release/mindc" \
               MINDC="${{ github.workspace }}/target/release/mindc" \
                 python3 scripts/run_gate.py "examples/mindc_mind/$s.py" | tee /tmp/wire_out.txt; then
              # Fail-closed: a "SKIP <so> not built" line exits 0 and would grade
              # a MISSING library as a pass. MINDC_SO is set and verified
              # non-empty above, so a SKIP here means the wiring broke, not that
              # the gate is inapplicable.
              # Anchored to column 0, `^SKIP` missed every INDENTED skip line
              # ("  SKIP  <check> unavailable", "  SKIPPED") that a multi-leg
              # smoke prints when only one leg opts out -- the backstop against
              # vacuous green had a hole in exactly the shape it exists to catch.
              # Leading whitespace is now allowed; the prefix still covers
