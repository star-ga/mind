name: CI

# GATE-RUNNER SCOPE — the cargo steps below are DEFERRED, not covered.
#
# Every gate a workflow step invokes goes through scripts/run_gate.py, which
# refuses a gate that exits 0 while publishing no `asserted=<N>` evidence and
# refuses a gate that announced a SKIP. `cargo test` cannot publish that line,
# so the ~15 cargo steps in this file are outside the contract. ONE known
# vacuity hole is left in that gap and is NOT closed by the runner:
#
#   * the differential fuzzer reads its program count from MINDFUZZ_ITERS with
#     no floor, so MINDFUZZ_ITERS=0 digests zero programs on BOTH runners —
#     equal, non-empty and green on `mindfuzz_cross_runner_identity`. Upgrade
#     path: emit `iters=<n>` into MINDFUZZ_DIGEST_OUT and have that job assert
#     n >= the default alongside the digest compare.
#
# CLOSED, to the width of its detector: the capability-skip hole
# (`println!("... skipping"); return;` turning a FAILING compile into a PASSING
# test). `tests/fail_open_skip_site_ratchet.rs` walks `tests/**/*.rs` from disk
# and fails on any site matching a skip SHAPE IT RECOGNISES that does not route
# through `tests/common/gate.rs`, which panics under MIND_BENCH_REQUIRE=1 and
# otherwise emits `SDLC-GATE <target> ran=0 fail=0`. The floor is zero — there is
# no backlog table — and the gate carries a per-harness minimum in every
# CRITICAL_<tier> array of scripts/exec_semantics_gate.sh, so it cannot quietly
# stop running. `tests/closed_declaration_wiring.rs` holds THIS note to that:
# it fails if the note stops naming its enforcement, if a named file is gone,
# or if any tier drops the row — a declaration whose subject can vanish under
# it is prose.
#
# The recognised shapes are enumerated in that file's header and each is held up
# by its own positive control. This note deliberately does NOT restate them as
# "every skip-and-return site". That wider sentence stood here while three
# fail-open compile skips (`if !s.success() { return; }`) and four announced
# probes that hand the caller `None` sat unseen in mindc_cache_phase_f,
# g2_differential_mlir, mindc_build_phase_a and mlir_build. Measured on this
# tree under that sentence: mindc_cache_phase_f ran EIGHT `mindc build`
# invocations, all eight failed with `error[build][E5003]`, and only TWO were
# counted — the other six graded as passing tests. It now reports 8 markers and
# 0 uncounted failures. A claim wider than its detector reads as coverage of
# exactly the gap the detector is blind to. Residual shapes ARE still undetected;
# they are named as deferred in that header, each measured escaping the shipped
# scanner. This note does not say how many, and the header no longer claims the
# tree holds none of them: that sentence stood here while the ratchet's probe
# vocabulary was an ALLOW-LIST OF FOUR calls and three live sites rode ordinary
# Rust spellings straight past it — including one on the TRACKED self-host source
# that graded a missing `examples/mindc_mind/main.mind` as a pass, and one skip in
# `g2_differential_mlir.rs` that emitted its marker by hand and so could not be
# turned into a failure by MIND_BENCH_REQUIRE=1. Counting residuals in a note is
# the same defect as widening the claim: whichever number is typed here is the
# one nobody re-measures.
#
# The width of that detector is itself the thing that moved. It used to pin a
# TEXT shape — a capability probe on one line, a bare early-out within two — and
# five ordinary Rust spellings of the identical fail-open skip passed it green
# (an early-out four lines down, a `let ... else`, a `None => return,` match arm,
# and the probe bound to a local first over `.exists()` and `.success()` alike).
# The decision now runs over the BRACE-BALANCED BLOCK of an `if` / `match` /
# `let ... else` whose scrutinee is derived from a capability probe, owned by
# `tests/skip_shape_scan/mod.rs`. Its vocabulary and its positive controls are a
# BIJECTION, asserted in both directions, so a spelling cannot enter the rule
# without a control proving the scanner fires on it, and a control cannot outlive
# the spelling it proves. That module is scanned by the prohibition it defines
# rather than exempted from it: it reads MASKED CODE, so a shape quoted in a
# string literal is not the shape, and a `gate::` marker in a comment can no
# longer buy a site a pass.
#
# scripts/gate_runner_wiring_lint.py holds this declaration to the deferral, and
# removes it the moment these steps stop being invoked directly.
# run_gate-exempt: cargo-test - deferred: a cargo step cannot publish asserted=N; upgrade path is the fuzzer program-count floor described above

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  pqc_hybrid_signing:
    name: PQC hybrid signing controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pqc-hybrid-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            pqc-hybrid-${{ runner.os }}-

      - name: Execute both-leg positive and non-degradability controls
        # The script first asks libtest for the exact tests selected by its
        # prefix, requires the two named controls, then requires both names and
        # an exact nonzero 2/2 result in the execution output. The tests use only
        # deterministic TEST seeds embedded in source; no live key is available
        # to this job.
        run: python3 scripts/run_gate.py --min-asserted 2 scripts/pqc_hybrid_ci.sh

  pqc_hybrid_cli:
    name: PQC hybrid signing CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS arm64
          - os: windows-latest
            name: Windows x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pqc-cli-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            pqc-cli-${{ runner.os }}-

      # The signing-capable binary ships for five platforms, so the verifier is
      # exercised on more than the one OS that happened to be convenient. These
      # controls drive the BUILT BINARY, not the library: they sign, verify,
      # attempt a scheme downgrade, mutate a signed application field, and pin
      # signer keys by role.
      #
      # The tests clear every signing and trust environment variable on both the
      # emit and the verify path, so an inherited MIND_EVIDENCE_VERIFY_PUBKEYS or
      # key seed on a runner cannot silently redefine what "trusted" means. That
      # hermeticity is itself verified by running the suite with all five
      # variables poisoned.
      #
      # Seeds are fixed TEST values embedded in source. No production key is
      # read, generated or required by this job, and nothing here signs a
      # release archive.
      - name: Execute CLI signing, tamper and key-pair controls
        shell: bash
        run: |
          # On Windows, run_gate's bare `bash` can resolve to the WSL launcher
          # instead of the Git Bash that is executing this step. Pass this
          # shell's executable explicitly; cygpath gives native Python a path
          # it can open without changing the Linux/macOS path.
          gate_bash="$BASH"
          if command -v cygpath >/dev/null 2>&1; then
            gate_bash="$(cygpath -w "$BASH")"
          fi
          python3 scripts/run_gate.py --min-asserted 15 "$gate_bash" scripts/pqc_hybrid_cli_ci.sh
      - name: Canonical byte integrity under the supported signing profile
        shell: bash
        run: MIND_TEST_REQUIRE_PQC=1 cargo test --release --locked --features std-surface,evidence-mldsa,evidence-slhdsa --test verify_canonical_bytes

  build_test:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macOS ARM64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86_64

    runs-on: ${{ matrix.os }}
    # Healthy matrix jobs finish in 4-9 min (Windows is slowest at ~8m); GitHub's
    # default cap is 6 HOURS. A scarce macos-14 ARM64 runner that stalls in
    # `cargo test` therefore burns hours before being killed and reported as an
    # opaque "failure". Bound it so a stall fails fast and legibly as `timed_out`
    # in 30 min (~4x headroom) — without masking any genuine test failure.
    timeout-minutes: 30

    env:
      # neutralize proxies
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt

      - name: Cache cargo registry (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache cargo registry (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Remove git proxies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          git config --global --unset-all http.proxy  || true
          git config --global --unset-all https.proxy || true

      - name: Remove git proxies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global --unset http.proxy 2>&1 | Out-Null
          git config --global --unset https.proxy 2>&1 | Out-Null
        continue-on-error: true

      - name: Cargo metadata (smoke)
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo metadata --format-version=1 --locked
          else
            cargo metadata --format-version=1
          fi

      - name: Check compiles (no features)
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --no-default-features --locked
          else
            cargo check --no-default-features
          fi

      - name: Feature compile matrix
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --no-default-features --locked
            cargo check --no-default-features --features cpu-exec --locked
            cargo check --no-default-features --features pkg --locked
          else
            cargo check --no-default-features
            cargo check --no-default-features --features cpu-exec
            cargo check --no-default-features --features pkg
          fi

      - name: Build
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --verbose --no-default-features --locked
          else
            cargo build --verbose --no-default-features
          fi

      - name: Test
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo test --verbose --no-default-features --locked
          else
            cargo test --verbose --no-default-features
          fi

      - name: Test (gated — RFC 0005 std-surface + cross-module-imports)
        # The RFC 0005 Phase 2 / Phase B work (std/vec.mind, std/string.mind,
        # std/map.mind, std/io.mind, plus the `use std.foo` resolver + the
        # per-arg signature matching on imported `pub fn`s) lives entirely
        # behind these two feature flags. The default-build test job above
        # does NOT compile them, so without this explicit gated run the
        # 45+17 gated tests are at risk of silent breakage. Both features
        # are mutually independent + must work on their own + together.
        shell: bash
        run: |
          set -e
          # Each feature alone — proves the gate is well-bounded.
          cargo test --verbose --no-default-features --features std-surface
          cargo test --verbose --no-default-features --features cross-module-imports
          # Both together — full RFC 0005 surface (Phase 2 + Phase B).
          cargo test --verbose --no-default-features --features std-surface,cross-module-imports

      - name: Run gated tests — autodiff + mlir-lowering + cpu-buffers
        # Five tests live behind these three feature flags and were never
        # executed in any CI matrix row before the 2026-05-19 stale-test
        # sweep:
        #   - tests/pipeline.rs::compile_source_runs_autodiff       (autodiff)
        #   - tests/pipeline.rs::pipeline_emits_grad_ir             (autodiff)
        #   - tests/pipeline.rs::lower_to_mlir_produces_stable_text (mlir-lowering)
        #   - tests/tensor_buffers.rs::* (2 tests)                  (cpu-buffers)
        # The default-build job above did `cargo check --features cpu-exec`
        # without running tests, so cpu-buffers / autodiff regressions
        # would have shipped silently.
        shell: bash
        run: |
          set -e
          cargo test --verbose --no-default-features --features autodiff
          cargo test --verbose --no-default-features --features mlir-lowering
          cargo test --verbose --no-default-features --features cpu-buffers

      - name: Install GNU timeout on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Run gated tests — ffi-c (mind_sys_* C-ABI surface)
        # `full` (documented in docs/cli.md + README.md) enables `ffi-c`, but no
        # matrix row above ever built it, so src/ffi/sys.rs was compiled by
        # nothing and its tests ran nowhere. That is how a debugger check that
        # left the process permanently ptrace-traced survived: the test binary
        # printed a green result and then exited into a zombie its parent could
        # not reap, so `cargo test` hung forever AFTER reporting success.
        #   - `timeout` turns a reintroduced hang into a fast, loud failure
        #     instead of burning the entire job budget on a green-looking run.
        #   - the count assertion turns a silently cfg'd-out module into a
        #     failure instead of the "ok. 0 passed" + exit 0 false green.
        shell: bash
        run: |
          set -e
          timeout 900 cargo test --verbose --no-default-features --features ffi-c --lib
          out=$(timeout 300 cargo test --no-default-features --features ffi-c --lib ffi::sys)
          echo "$out"
          n=$(printf '%s\n' "$out" | sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' | head -1)
          # Three portable tests plus the Linux-only ptrace-state regression.
          expected=3
          if [ "$RUNNER_OS" = "Linux" ]; then expected=4; fi
          if [ "${n:-0}" -lt "$expected" ]; then
            echo "FAIL: expected >=$expected ffi::sys tests on $RUNNER_OS, saw ${n:-0} - module cfg'd out or guards deleted" >&2
            exit 1
          fi
          echo "ffi::sys guards executed: $n"
          # tests/ffi_header.rs is `#![cfg(feature = "ffi-c")]`. Both runs above are
          # `--lib`, which never builds an integration target, so that file compiled
          # to an EMPTY HARNESS in every CI run — `ok. 0 passed`, exit 0 — and its
          # C-header symbol contract was asserted by nothing. Same positive-count
          # discipline as the ffi::sys assert: a `--test` selector alone is not
          # evidence that the tests inside it existed.
          hout=$(timeout 300 cargo test --no-default-features --features ffi-c --test ffi_header)
          echo "$hout"
          hn=$(printf '%s\n' "$hout" | sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' | head -1)
          if [ "${hn:-0}" -lt 1 ]; then
            echo "FAIL: tests/ffi_header.rs executed ${hn:-0} tests - cfg'd out (empty harness), not passing" >&2
            exit 1
          fi
          echo "ffi_header tests executed: $hn"

      - name: Clippy
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo clippy --no-default-features --locked -- -D warnings
          else
            cargo clippy --no-default-features -- -D warnings
          fi

  cross_substrate_identity:
    # RFC 0020 §10 — the wedge's load-bearing invariant made enforceable: a
    # Q16.16 workload MUST hash byte-identically on every substrate (RFC 0015
    # §3.1). x86_64 verifies the `avx2` reference; the Linux ARM runner verifies
    # the `neon` reference on real aarch64 hardware — without it the committed
    # neon hash is an unverified copy of avx2 and an ARM lowering divergence
    # would ship green. MIND_BENCH_REQUIRE=1 turns a missing MLIR toolchain into
    # a hard failure so the gate can never pass vacuously.
    name: Cross-substrate bit-identity (${{ matrix.substrate }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            substrate: avx2
          - runner: ubuntu-24.04-arm
            substrate: neon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30  # build mindc + run the ELF byte-identity gate; bound stalls

    env:
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      MIND_BENCH_REQUIRE: "1"
      MIND_INTDOT_VNNI_VERIFY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-xsi-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.runner }}-xsi-

      - name: Install MLIR toolchain (Ubuntu 24.04 LLVM 20)
        # Noble universe also packages llvm-20 (1:20.1.2); we pin it on both
        # x86_64 and arm64 so the gate shells out to unversioned mlir-opt /
        # mlir-translate / clang in /usr/lib/llvm-20/bin. The wedge is
        # LLVM-version-independent (the gate hashes the Q16.16 result, not
        # codegen) — verified to match the llvm-18-blessed references.
        run: |
          # ports.ubuntu.com (arm64 mirror) has transient outages that red the
          # ARM leg on an UPSTREAM issue, not a code defect. Retry up to 5x with
          # backoff + --fix-missing before failing; the byte-identity assertion
          # itself is unchanged.
          ok=0
          for attempt in 1 2 3 4 5; do
            sudo apt-get update || true
            if sudo apt-get install -y --fix-missing mlir-20-tools clang-20; then ok=1; break; fi
            echo "apt attempt $attempt failed (mirror outage?); retry in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "MLIR toolchain unavailable after 5 attempts (upstream apt mirror outage)"; exit 1; }
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain on PATH
        run: |
          # `tool --version | head -1` is NOT a verification: without pipefail the
          # pipeline's status is head's, so an ABSENT or broken tool exits 0 and
          # this step -- whose entire job is catching a toolchain that never made
          # it onto PATH -- passes. (The GitHub default shell is `bash -e {0}`;
          # pipefail is only on when a step sets `shell: bash` or asks for it.)
          # Run each tool WITHOUT a pipe so `-e` sees its real status, and check
          # presence explicitly; head then reads a file and cannot mask anything.
          # Not `set -o pipefail` on the original pipes: `head -1` closes early
          # and would SIGPIPE the tool, trading a false pass for a false failure.
          set -e
          for t in mlir-opt mlir-translate clang; do
            command -v "$t" >/dev/null || { echo "FAIL: $t is not on PATH"; exit 1; }
            "$t" --version > /tmp/toolver.txt
            head -1 /tmp/toolver.txt
          done

      - name: Build mindc (MLIR backend)
        run: |
          cargo build --no-default-features \
            --features "mlir-build std-surface cross-module-imports" --bin mindc

      - name: Tensor parameter ABI gates (x86/ARM)
        # Both descriptor execution and fail-loud tensor-boundary controls are
        # mandatory on each runner in this matrix.  The job-level
        # MIND_BENCH_REQUIRE=1 turns a missing backend into a failure, so these
        # selectors cannot pass as capability skips or empty harnesses.
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 cargo test --release --no-default-features \
            --features "mlir-build std-surface cross-module-imports" \
            --test tensor_param_descriptor_abi_run -- --nocapture
          timeout 600 cargo test --release --no-default-features \
            --features "mlir-build std-surface cross-module-imports" \
            --test tensor_param_fail_loud_run -- --nocapture

      - name: Cross-substrate reproducibility gate
        id: xsi_gate
        # Host substrate (avx2 on x86_64, neon on aarch64) is verified here;
        # the other substrate is verified on its sibling matrix runner. Every
        # manifest case must atomically publish a measured/deferred receipt;
        # the second target compares that executed set to the manifest set.
        run: |
          set -euo pipefail
          receipt_dir="$(mktemp -d "$RUNNER_TEMP/mind-xsi-receipts.XXXXXX")"
          echo "receipt_dir=$receipt_dir" >> "$GITHUB_OUTPUT"
          export MIND_XSI_RECEIPTS_DIR="$receipt_dir"
          cargo test --no-default-features \
            --features "mlir-build std-surface cross-module-imports" \
            --test cross_substrate_identity -- --nocapture
          cargo test --no-default-features \
            --features "mlir-build std-surface cross-module-imports" \
            --test cross_substrate_receipts -- --include-ignored --nocapture

      - name: Preserve asserting cross-substrate evidence
        if: ${{ always() && steps.xsi_gate.outputs.receipt_dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-substrate-evidence-${{ matrix.substrate }}-${{ github.sha }}
          path: ${{ steps.xsi_gate.outputs.receipt_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Harvest per-substrate canary hashes (bless manifest)
        # NOT a gate — the gate above already ran and had to pass. This is a
        # BLESS-mode replay whose only product is a durable artifact listing the
        # hash this substrate's REAL hardware computed for every canary.
        #
        # Why it exists: the strict-f32 `neon` lines went unblessed for months
        # even though the ubuntu-24.04-arm runner (real aarch64) had been
        # computing the correct hashes on every single CI run — and discarding
        # them into a job log that expires. Closing that hole required scraping
        # an old log. With this step, blessing a canary on a substrate we do not
        # own locally is a `gh run download`, not archaeology.
        #
        # Fail-safe by construction: MIND_BENCH_BLESS makes the run assert
        # NOTHING, so this step can neither turn a red gate green nor weaken the
        # gate above. It only records what the hardware said.
        env:
          MIND_BENCH_BLESS: "1"
          MIND_BENCH_HASHES_OUT: ${{ github.workspace }}/canary_hashes_${{ matrix.substrate }}.txt
        run: |
          # The asserting run above retains the job-level requirement. Harvest
          # only records hashes; its BLESS mode must not claim gate evidence.
          unset MIND_BENCH_REQUIRE
          cargo test --no-default-features \
            --features "mlir-build std-surface cross-module-imports" \
            --test cross_substrate_identity -- --nocapture
          echo "--- harvested (${{ matrix.substrate }}, $(uname -m)) ---"
          sort -o "$MIND_BENCH_HASHES_OUT" "$MIND_BENCH_HASHES_OUT"
          cat "$MIND_BENCH_HASHES_OUT"

      - name: Upload per-substrate canary hashes (${{ matrix.substrate }})
        uses: actions/upload-artifact@v4
        with:
          name: canary-hashes-${{ matrix.substrate }}
          path: ${{ github.workspace }}/canary_hashes_${{ matrix.substrate }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Differential determinism fuzzer (issue #72)
        # Seeded generator (0xDEADBEEF) emits a bounded batch of valid MIND
        # programs over `+ - * / % << >> |` and `if/else`; each is proven a mic@3
        # byte fixed point AND differentially executed through THREE oracles that
        # must agree — native-ELF == in-test interpreter == mic@3 bytecode VM (the
        # decoded mic@3 is RUN, not just hashed, so an operator correct in only
        # one lowering path — the `%`-class silent miscompile — turns this RED).
        # Runs on BOTH matrix substrates and writes the batch mic@3 digest (which
        # is substrate-independent by construction, RFC 0015 §3.1) to a file so
        # the dependent `mindfuzz_cross_runner_identity` job can ASSERT x86 == ARM
        # across the two runners — not merely print it.
        env:
          MINDFUZZ_DIGEST_OUT: ${{ github.workspace }}/mindfuzz_digest_${{ matrix.substrate }}.txt
        run: |
          cargo test --no-default-features \
            --features "mlir-build std-surface cross-module-imports" \
            --test mindfuzz_cross_substrate -- --nocapture

      - name: Upload fuzzer batch mic@3 digest (${{ matrix.substrate }})
        # One artifact per substrate; the cross-runner job downloads both and
        # byte-compares them. A per-substrate name keeps the two uploads distinct.
        uses: actions/upload-artifact@v4
        with:
          name: mindfuzz-digest-${{ matrix.substrate }}
          path: ${{ github.workspace }}/mindfuzz_digest_${{ matrix.substrate }}.txt
          if-no-files-found: error
          retention-days: 7

  mindfuzz_cross_runner_identity:
    # RANK 1 (existential): make the fuzzer's cross-runner mic@3 digest a real
    # ASSERTION, not a print. mic@3 is emitted before any substrate lowering and
    # is substrate-independent by construction (RFC 0015 §3.1), so the batch
    # digest the avx2 (x86_64) runner computes over the seeded corpus MUST equal
    # the one the neon (real aarch64) runner computes. This job downloads both
    # runners' digest artifacts and FAILS RED on any mismatch — a real x86 != ARM
    # divergence in the fuzzed corpus can no longer ship green (MIND-CONSTITUTION
    # §I.4). `needs:` gates it on both matrix legs producing their artifact.
    name: Fuzzer cross-runner mic@3 identity (avx2 == neon)
    needs: cross_substrate_identity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download avx2 digest
        uses: actions/download-artifact@v4
        with:
          name: mindfuzz-digest-avx2
          path: avx2

      - name: Download neon digest
        uses: actions/download-artifact@v4
        with:
          name: mindfuzz-digest-neon
          path: neon

      - name: Assert avx2 batch digest == neon batch digest
        # Genuine cross-runner byte compare. mic@3 carries no machine bytes, so
        # any difference here is a real cross-substrate divergence in the fuzzed
        # corpus — a wedge break — and MUST fail the build.
        run: |
          set -euo pipefail
          # File format (written by tests/mindfuzz_cross_substrate.rs):
          #   iters=<program count>
          #   <64-hex batch mic@3 digest>
          # The count is compared as well as the digest. Equality of two digests
          # says nothing about how much was hashed: with MINDFUZZ_ITERS=0 both
          # runners wrote the SHA-256 of NOTHING — non-empty, equal, and this job
          # printed PASS having compared no programs at all. The test now refuses
          # any count below its floor, and this job refuses a file that does not
          # state a count at or above that floor, so neither side can go vacuous.
          MIN_ITERS=32
          read_count() { sed -n 's/^iters=\([0-9][0-9]*\)$/\1/p' "$1" | head -1; }
          read_digest() { sed -n '2p' "$1" | tr -d '[:space:]'; }
          AVX2_N="$(read_count avx2/mindfuzz_digest_avx2.txt)"
          NEON_N="$(read_count neon/mindfuzz_digest_neon.txt)"
          AVX2="$(read_digest avx2/mindfuzz_digest_avx2.txt)"
          NEON="$(read_digest neon/mindfuzz_digest_neon.txt)"
          echo "avx2 (x86_64)  programs = ${AVX2_N:-<none>}  batch mic@3 digest = ${AVX2}"
          echo "neon (aarch64) programs = ${NEON_N:-<none>}  batch mic@3 digest = ${NEON}"
          if [ -z "${AVX2}" ] || [ -z "${NEON}" ]; then
            echo "FAIL: a batch digest is empty — the fuzzer did not run on a substrate"
            exit 1
          fi
          if [ -z "${AVX2_N}" ] || [ -z "${NEON_N}" ]; then
            echo "FAIL: a digest file states no program count — refusing to compare"
            echo "      two digests over an unknown (possibly empty) corpus."
            exit 1
          fi
          if [ "${AVX2_N}" -lt "${MIN_ITERS}" ] || [ "${NEON_N}" -lt "${MIN_ITERS}" ]; then
            echo "FAIL: fuzzed corpus below the floor (${MIN_ITERS}):"
            echo "      avx2=${AVX2_N} neon=${NEON_N}. A digest over a shrunken corpus"
            echo "      is not evidence of cross-substrate identity."
            exit 1
          fi
          if [ "${AVX2_N}" != "${NEON_N}" ]; then
            echo "FAIL: the runners fuzzed DIFFERENT program counts"
            echo "      (avx2=${AVX2_N}, neon=${NEON_N}) — the digests are not comparable."
            exit 1
          fi
          if [ "${AVX2}" != "${NEON}" ]; then
            echo "FAIL: fuzzer mic@3 batch digest DIVERGED across substrates."
            echo "      mic@3 is substrate-independent by construction (RFC 0015 §3.1);"
            echo "      a difference is a real x86 != ARM cross-substrate wedge break."
            exit 1
          fi
          echo "PASS: avx2 == neon over ${AVX2_N} programs — fuzzed corpus is byte-identical mic@3 across substrates."

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-default-features --document-private-items

  mindcraft_self_host:
    name: Mindcraft self-host (RFC 0008 Phase G — KEYSTONE)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # MIND_BENCH_REQUIRE=1 makes the keystone fail-closed: a missing MLIR
    # toolchain or a launcher-stub artifact becomes a hard failure instead of a
    # silent skip (#306). With the toolchain installed below this passes
    # deterministically — the keystone verifies SELF-CONSISTENCY (two clean
    # builds of the self-host .so in this environment are byte-identical), not a
    # match against a committed cross-toolchain binary oracle (which would be
    # clang-patch-version specific and unworkable to commit).
    env:
      MIND_BENCH_REQUIRE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python for numerical smoke oracles
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install numerical smoke dependencies
        run: python3 -m pip install numpy

      - name: Smoke-corpus wiring contract (smoke_wiring_lint.py)
        # Guards the gate corpus itself. Every examples/mindc_mind/*.py must be
        # classified in SMOKE_WIRING.tsv with the runners that actually execute
        # it; the lint re-derives that set from .github/workflows/*.yml,
        # examples/mindc_mind/fast_keystone.sh and scripts/preflight.sh and fails
        # on drift in either direction (unclassified file, stale row, wrong
        # runner set, or an unwired gate with no stated reason). Pure text
        # analysis — no build artifacts needed, so it runs FIRST in this job,
        # before the MLIR install and the mindc build, and fails fast.
        run: python3 scripts/run_gate.py examples/mindc_mind/smoke_wiring_lint.py
        working-directory: ${{ github.workspace }}

      - name: Gate-assert count contract (tests/gate_assert_count_contract_test.py)
        # Guards the number every other gate is judged by. `asserted=<N>` used to
        # be derivable from a line a gate PRINTED: any `ran=<n>` anywhere in the
        # output replaced all other evidence, so a smoke publishing
        # `(ran={len(CASES)})` reported the length of a list — emptying its case
        # loop still said 8 — and a gate writing `asserted=99` to stderr outranked
        # the shim's own verdict. This test pins the repaired contract: markers are
        # read only in the two shapes the repo already publishes, a marker never
        # manufactures evidence, a self-published contract line fails closed, and
        # the lint refuses a gate source that prints those shapes by hand. Pure
        # Python, no build artifacts — runs beside the wiring lint, fails fast.
        run: python3 scripts/run_gate.py tests/gate_assert_count_contract_test.py
        working-directory: ${{ github.workspace }}

      - name: Bootstrap advancement harness controls
        # Synthetic process/oracle controls for seed identity, agreement,
        # publication and rollback. The real compiler loop runs separately.
        run: python3 scripts/run_gate.py tests/self_host_loop_advance_test.py
        working-directory: ${{ github.workspace }}

      - name: Gate-vacuity sweep (run_gate.py --vacuity-sweep)
        # THE POSITIVE CONTROL for every gate in this repo. Runs the whole smoke
        # corpus TWICE, once per way of taking the compiler away, and REQUIRES
        # every compiler-dependent gate to be rejected in both:
        #   (1) the toolchain handles (MINDC / MINDC_BIN / MINDC_SO /
        #       MINDC_NATIVE_ELF) SET to paths that do not exist;
        #   (2) those handles REMOVED and every PATH entry holding a `mindc`
        #       scrubbed. Leg (1) cannot see a gate that defaulted to the bare
        #       name "mindc": it never reads the handle, so it silently ran
        #       whatever `mindc` was on PATH — another checkout's binary.
        #       Measured on a pristine copy of the tree with no target/ and every
        #       handle unset: 21 compiler-dependent gates still reported PASS.
        # Leg (2) needs a tree with no target/release/mindc; THIS STEP RUNS BEFORE
        # THE CARGO BUILD, which is exactly that condition. It refuses (exit 1)
        # rather than report itself passed if it cannot create the negative case.
        # Measured before scripts/run_gate.py
        # existed: 108 of the 146 corpus gates still exited 0 with the compiler
        # binary absent, because an exit code answers "did anything that ran fail",
        # never "did anything run" — rh_f64_aggregate_canary_smoke.py printed
        # `SKIP  mindc not built` and returned 0 as a REQUIRED step of THIS job.
        # Every gate now publishes `asserted=<N>` and the runner refuses N==0, a
        # missing line, or a `SKIP` line. This sweep fails when it finds NOTHING
        # wrong with the negative case, so it cannot rot into a vacuous pass itself.
        # Pure Python, no build artifacts — runs before the MLIR install, fails fast.
        run: python3 scripts/run_gate.py --vacuity-sweep
        working-directory: ${{ github.workspace }}

      - name: std manifest contract (stdlib_manifest_lint.py)
        # Guards WHICH std/*.mind modules each consumer links. That membership used
        # to be 17 hand-copied literal lists (the native-backend bridge in
        # src/bin/mindc.rs + 16 copies across examples/mindc_mind/*.py) plus a
        # fourth, DIFFERENT list (STDLIB_MIND_SOURCES in src/project/stdlib.rs, the
        # `use std.<m>` resolver) with nothing asserting they agreed.
        # testdata/stdlib_manifest.txt is the checked contract: exhaustive over
        # std/*.mind, so a NEW std module fails here until someone records a
        # deliberate in/out decision per consumer. The lint checks manifest<->disk
        # and manifest<->STDLIB_MIND_SOURCES in BOTH directions, and pins the seed
        # blob's sha256 — reordering or changing the seed set changes the compiled
        # bytes of every native build (a whole-corpus RESEED event), so it must not
        # be able to land as a quiet one-line edit. Pure text analysis, no build
        # artifacts, so it runs early and fails fast alongside the wiring lint.
        run: python3 scripts/run_gate.py examples/mindc_mind/stdlib_manifest_lint.py
        working-directory: ${{ github.workspace }}

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mindcraft-self-host-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-mindcraft-self-host-

      - name: Install MLIR toolchain (Ubuntu 24.04 LLVM 20)
        # The cdylib/self-host emit lowers MIND IR to MLIR text and shells out to
        # mlir-opt + mlir-translate + clang to produce the .so (the in-process
        # melior/inkwell LLVM crates were removed 2026-05-21, but the emit still
        # uses these LLVM/MLIR subprocess tools), so the keystone DOES depend on
        # this toolchain. Pinned to llvm-20 for parity with the cross-substrate
        # gate's toolchain and the --emit-shared sub-steps.
        run: |
          # ports.ubuntu.com (arm64 mirror) has transient outages that red the
          # ARM leg on an UPSTREAM issue, not a code defect. Retry up to 5x with
          # backoff + --fix-missing before failing; the byte-identity assertion
          # itself is unchanged.
          ok=0
          for attempt in 1 2 3 4 5; do
            sudo apt-get update || true
            if sudo apt-get install -y --fix-missing mlir-20-tools clang-20; then ok=1; break; fi
            echo "apt attempt $attempt failed (mirror outage?); retry in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "MLIR toolchain unavailable after 5 attempts (upstream apt mirror outage)"; exit 1; }
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain on PATH
        run: |
          # `tool --version | head -1` is NOT a verification: without pipefail the
          # pipeline's status is head's, so an ABSENT or broken tool exits 0 and
          # this step -- whose entire job is catching a toolchain that never made
          # it onto PATH -- passes. (The GitHub default shell is `bash -e {0}`;
          # pipefail is only on when a step sets `shell: bash` or asks for it.)
          # Run each tool WITHOUT a pipe so `-e` sees its real status, and check
          # presence explicitly; head then reads a file and cannot mask anything.
          # Not `set -o pipefail` on the original pipes: `head -1` closes early
          # and would SIGPIPE the tool, trading a false pass for a false failure.
          set -e
          for t in mlir-opt mlir-translate clang; do
            command -v "$t" >/dev/null || { echo "FAIL: $t is not on PATH"; exit 1; }
            "$t" --version > /tmp/toolver.txt
            head -1 /tmp/toolver.txt
          done

      - name: Build mindc (MLIR backend)
        run: |
          cargo build --release --no-default-features \
            --features "mlir-build std-surface cross-module-imports" --bin mindc

      - name: Self-host bootstrap via mindc build (Mind.toml)
        run: |
          ./target/release/mindc build --release --emit=cdylib \
            --out=/tmp/libmindc_mind_self_host.so
        working-directory: ${{ github.workspace }}

      - name: Verify artifact is non-empty
        run: |
          if [ ! -f /tmp/libmindc_mind_self_host.so ]; then
            echo "ERROR: artifact not produced by mindc build"
            exit 1
          fi
          SZ=$(stat -c%s /tmp/libmindc_mind_self_host.so)
          echo "Artifact size: ${SZ} bytes"
          if [ "$SZ" -eq 0 ]; then
            echo "ERROR: artifact is empty"
            exit 1
          fi

      - name: Byte-identity check (Mind.toml-driven vs direct-path)
        run: |
          ./target/release/mindc build \
            examples/mindc_mind/main.mind \
            --release --emit=cdylib \
            --out=/tmp/libmindc_mind_direct.so
          if cmp -s /tmp/libmindc_mind_self_host.so /tmp/libmindc_mind_direct.so; then
            echo "KEYSTONE PASS: byte-identical"
            sha256sum /tmp/libmindc_mind_self_host.so
          else
            echo "KEYSTONE FAIL: Mind.toml-driven and direct-path artifacts differ"
            sha256sum /tmp/libmindc_mind_self_host.so /tmp/libmindc_mind_direct.so
            exit 1
          fi

      - name: Self-host stale-oracle guard (selfhost_so_provenance_smoke.py)
        # Every smoke below resolves its `.so` through `_selfhost_so.resolve_so()`.
        # That resolver used to hand back whatever `MINDC_SO` named without any
        # freshness check, and only ONE of ~47 importers consulted the fallback
        # flag — so a months-old in-tree artifact could certify byte-identity in
        # every sibling gate while the self-host loop gate, on the same bytes,
        # refused. This asserts the resolver still REFUSES what it cannot prove
        # fresh and that no smoke opts out unnamed. Pure stdlib; needs no `.so`.
        #
        # --min-asserted 16 is what makes the count load-bearing. This gate reports
        # sixteen NAMED legs and does not loop, so an unpinned floor of 1 would be
        # cleared by any one of them; with the floor at the leg count, deleting a
        # check fails HERE instead of quietly shrinking the evidence.
        run: |
          python3 scripts/run_gate.py --min-asserted 16 \
            examples/mindc_mind/selfhost_so_provenance_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Real-body emitter smoke (self_host_body_smoke.py)
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
            python3 scripts/run_gate.py examples/mindc_mind/self_host_body_smoke.py
        working-directory: ${{ github.workspace }}

      - name: mic@3 primitives smoke (mic3_primitives_smoke.py)
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
            python3 scripts/run_gate.py examples/mindc_mind/mic3_primitives_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Whole-module mic@3 self-host FLIP (mic3_flip_smoke.py)
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
          MINDC=${{ github.workspace }}/target/release/mindc \
            python3 scripts/run_gate.py examples/mindc_mind/mic3_flip_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Self-host MLIR-text f64+i64 emit gate (self_host_mlir_smoke.py)
        # Byte-identity of the pure-MIND selftest_emit_mlir vs `mindc --emit-mlir`
        # for the scalar i64 subset AND the f64 scalar surface (#298 step 1: f64
        # params/returns, arith.addf/subf/mulf/divf, canonicalized f64 constants).
        # Oracle regenerated live from the freshly-built mindc — no fake wins.
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
          MINDC_BIN=${{ github.workspace }}/target/release/mindc \
            python3 scripts/run_gate.py examples/mindc_mind/self_host_mlir_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Per-arm oracle-parity linter (oracle_parity_lint.py)
        # Localises which self-host ARM drifted from the Rust oracle. The
        # whole-module FLIP above reports one byte offset on the full stream;
        # this asserts each construct's mic@3 bytes are byte-identical to
        # `mindc --emit-mic3` and prints the SHA-256 of both sides on any drift,
        # so an emitter/oracle divergence is diagnosed per-construct and can
        # never land silently. MINDC_SO is set, so it fails closed (never skips).
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
          MINDC=${{ github.workspace }}/target/release/mindc \
            python3 scripts/run_gate.py examples/mindc_mind/oracle_parity_lint.py
        working-directory: ${{ github.workspace }}

      - name: Self-host gap-corpus integrity gate (gap_corpus_smoke.py)
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
          MINDC=${{ github.workspace }}/target/release/mindc \
            python3 scripts/run_gate.py examples/mindc_mind/gap_corpus_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Self-host LOOP gate — MIND compiles MIND, Rust+LLVM out (self_host_loop_smoke.py)
        # `--min-asserted 2` because this gate has TWO legs and only the pair is
        # the gate: PRIMARY (the frozen pure-MIND stage0 still reproduces itself)
        # and ORACLE (the CURRENT std/*.mind + main.mind has not drifted from that
        # frozen ELF). With the `.so` away the ORACLE leg used to print a
        # `NOTE ... SKIPPED` line and return 0 — asserted=1, exit 0, source-drift
        # detection gone and the step green. The floor makes the missing leg the
        # failure it is; MINDC_SO below is what makes both legs runnable.
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
            python3 scripts/run_gate.py --min-asserted 2 examples/mindc_mind/self_host_loop_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Native-ELF scalar-f64 execution gate (self_host_native_fp_smoke.py)
        # RI-B1 native-ELF float column (roadmap C1). No frozen float byte-oracle
        # can exist (the deleted Rust native backend rejected ConstF64), so the CPU
        # is the oracle: emit the pure-MIND SSE2 ELF, run it, assert the exit code
        # equals trunc(a OP b) for reg-form AND mem-operand [rbp+d32] encoders. A
        # wrong SSE encoding faults or returns the wrong integer — non-fakeable.
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
            python3 scripts/run_gate.py examples/mindc_mind/self_host_native_fp_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Native-ELF integer byte-identity gate (self_host_native_elf_smoke.py)
        # Per-fixture byte-identity of the pure-MIND native-ELF emitter vs the frozen
        # Rust `mind-native` oracle (add/if_ret/value_if/recursion/struct_field), FED
        # and NO-FEED (self-computed PT_NOTE == pinned Rust emit_mic3 reference), plus
        # the pure-MIND SHA-256 leg. MIND_SELFHOST_SKIP_REF_REGEN=1 pins the committed
        # _ref cache (refreshed in-tree via dump_ref) instead of a nested cargo build.
        # The whole-module main.mind rungs are DEFERRED (the frozen main.elf oracle is
        # unregenerable since src/native was deleted, and main.mind has grown) — the
        # smoke names that deferral loudly; the per-fixture byte-identity stays gated.
        env:
          MIND_SELFHOST_SKIP_REF_REGEN: "1"
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
            python3 scripts/run_gate.py examples/mindc_mind/self_host_native_elf_smoke.py
        working-directory: ${{ github.workspace }}

      - name: RI-D seam gates — mindc build --backend=native (bridge + exact fail-close diagnostics)
        # RI-D0: `mindc build --backend=native` is a byte-faithful pass-through to the
        # frozen pure-MIND stage1.elf (zero MLIR/LLVM/clang), fail-closed on garbage
        # (backend_native_bridge_smoke.py). RI-D1a (#313): a native fail-close is no
        # longer a silent 0-byte-exit-0 — the pure-MIND driver names the unsupported
        # construct on stderr and exits non-zero (tensor / trait-impl EXACT), while a
        # supported scalar program still compiles + runs (self_host_native_diag_smoke.py).
        # Both drive the SHIPPING mindc + committed stage1.elf, so a driver/bridge
        # regression that reverted the diagnostic to the generic 0-byte message would
        # otherwise land CI-green.
        run: |
          set -e
          python3 scripts/run_gate.py examples/mindc_mind/backend_native_bridge_smoke.py
          MINDC_BIN=${{ github.workspace }}/target/release/mindc \
            python3 scripts/run_gate.py examples/mindc_mind/self_host_native_diag_smoke.py
        working-directory: ${{ github.workspace }}

      - name: RH f64-aggregate surface canary (rh_f64_aggregate_canary_smoke.py)
        # RH_REQUIRED_F64_AGGREGATE_SURFACE — deterministic LDL^T elimination on a
        # 4x4 rational SPD matrix (entries + factors exactly representable in
        # binary64) exercising local `[f64; N]` arrays, runtime load+store, store
        # inside loops, flat `m[i*n+j]` matrix, a read-only `[f64; 4]` param helper,
        # and f64 loop accumulators. MLIR leg (`--emit=binary`) is REQUIRED to return
        # the bit-exact 37; the native leg (`--backend native`) must fail CLOSED until
        # the fixed-array store + array-param are ported to the pure-MIND emitter
        # (no silent wrong-value artifact). Uses the mlir-build mindc built above.
        run: |
          MINDC_BIN=${{ github.workspace }}/target/release/mindc \
            python3 scripts/run_gate.py examples/mindc_mind/rh_f64_aggregate_canary_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Native-ELF float end-to-end gate (self_host_native_fp_expr_smoke.py)
        # RI-B1 CAPSTONE (roadmap C1): nb_expr now routes an ast_float_lit's value
        # through the SSE2 scalar-double encoders (nb_fp_const_xmm + movsd-store to the
        # value's [rbp+d32] slot), NOT the GP-integer const path. A REAL float source
        # literal is lexed + parsed + lowered THROUGH nb_expr, then loaded back to xmm0
        # and cvttsd2si -> exit(trunc(value)). No frozen float byte-oracle can exist
        # (the deleted Rust native backend rejected ConstF64), so the CPU is the oracle:
        # a wrong SSE encoding or wrong IEEE-754 bits faults or returns the wrong integer
        # — non-fakeable execution-correctness. main.mind's own source stays float-free,
        # so this arm is never taken during self-compile (integer byte-identity holds).
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
            python3 scripts/run_gate.py examples/mindc_mind/self_host_native_fp_expr_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Self-host ADDITIVE selftest gates (C4 tensor ops + type-checker rules + narrow/f32/div)
        # These smokes exercise ADDITIVE selftest_* exports (the C4 native-ELF
        # tensor ops ewadd/dot/matmul; the pure-MIND type-checker rule ports
        # E2004/E2005/E2010/E2011/E2013/E2016/E2023/E2101/E2102/E2103; the E2008
        # unknown-variant + E2024 intrinsic-table advisory rules; and the B1
        # scope-frame engine — D1 module decl-name set, D2 nested scope-frame
        # walk, D3 std-surface export set, D4 assembled E2012 fn-value-call
        # rule — whose THREE-WAY smokes ALSO run the
        # live `mindc check` oracle leg (MINDC_BIN below points them at the
        # just-built mindc; without it their leg-3 subprocess would FileNotFound);
        # narrow-int store/load + wrap + declared-width driver; scalar f32;
        # div/shift/cmp edges; % operator; and the self-host arena-headroom
        # canary). They are reached ONLY via the selftest_* exports, never
        # through mindc_compile, so the self-host LOOP + native-ELF byte-identity
        # gates above do NOT cover their correctness — a regression in an additive
        # emitter/rule would otherwise land CI-green. MINDC_SO is set, so every
        # smoke fails closed (never SKIPs).
        #
        # WIRING CONTRACT: this comment used to claim "fast_keystone.sh runs the
        # SAME set locally; when adding a new additive selftest smoke, wire it
        # into BOTH." That was false in both directions — this loop was a strict
        # SUBSET of fast_keystone.sh (46 of its 60), CI never invokes
        # fast_keystone.sh at all, and dozens of smokes ran in neither. Prose
        # cannot be executed, so it drifted silently.
        #
        # The contract is now a CHECKED artifact instead of a claim:
        # examples/mindc_mind/SMOKE_WIRING.tsv declares, per smoke, which runners
        # execute it and why, and examples/mindc_mind/smoke_wiring_lint.py
        # (wired as the first step of this job) recomputes the real wiring from
        # these workflow files + fast_keystone.sh + scripts/preflight.sh and
        # fails on ANY divergence. Adding a smoke without classifying it is a
        # build error, so a new gate can no longer go unwired unnoticed.
        run: |
          set -e
