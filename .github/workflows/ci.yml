      - name: Differential fuzzer — tc-rule ports vs live mindc (tcdiff)
        # The self_host_tc_* smokes above are CURATED fixtures; tcdiff GENERATES
        # ~400 parseable MIND programs per rule and diffs the pure-MIND selftest
        # verdict against live `mindc check` over the token x position matrix the
        # hand corpus keeps missing. It found the folded-keyword fail-OPEN class
        # across E2002/E2003/E2009 that 3 fix rounds + 2 cross-family blind reviews
        # all missed while the curated smokes stayed green. Fixed seed => the same
        # programs every run (deterministic); a planted-mutant gate runs first and
        # proves it still catches a fail-open; any divergence fails the build. Cheap
        # (~10s: one `mindc check` per generated program, all 4 rules scored from it).
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
          MINDC_BIN="${{ github.workspace }}/target/release/mindc" \
            python3 scripts/run_gate.py examples/mindc_mind/tc_differential_fuzz.py --rule all --ci --budget 400
          # T1 type-inference: `let x: T = <literal>` scalar-class (E2015).
          # Dedicated annotation x RHS-literal corpus (not the position grid);
          # planted literal-tag-flip mutation gate runs first.
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
          MINDC_BIN="${{ github.workspace }}/target/release/mindc" \
            python3 scripts/run_gate.py examples/mindc_mind/tc_differential_fuzz.py --rule E2015 --ci
        working-directory: ${{ github.workspace }}

      - name: DTK register-allocator cross-implementation parity
        # The ONLY gate comparing the pure-MIND nb_dtk_* planner — which SHIPS
        # inside the frozen stage1.elf and decides which register every value
        # lands in — against the Rust reference plan_module_k. A divergence is a
        # silent wrong-register miscompile in the shipped bootstrap compiler.
        # tests/regalloc_dtk_parity.rs is Rust-vs-Rust against hardcoded tables
        # and does not substitute for it.
        #
        # It ran ONLY in scripts/preflight.sh, which no workflow invokes, so a
        # regression landed CI-green. MINDC_SO is set to the .so built above and
        # MIND_DTK_SKIP_RUST_REGEN=1 pins the reference side, so a missing
        # library fails closed instead of skipping.
        run: |
          MINDC_SO=/tmp/libmindc_mind_self_host.so \
          MIND_DTK_SKIP_RUST_REGEN=1 \
          MINDC_BIN="${{ github.workspace }}/target/release/mindc" \
            python3 scripts/run_gate.py \
              examples/mindc_mind/testdata/dtk_plan_parity_smoke.py
        working-directory: ${{ github.workspace }}

      - name: Run Phase G integration tests
        run: |
          cargo test --release --no-default-features \
            --features "mlir-build std-surface cross-module-imports" \
            --test phase_g_keystone_bootstrap -- --nocapture

  executable_miscompile_gate:
    name: Executable miscompile gate (compile + run + assert)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Compile a tiny deterministic MIND kernel to a cdylib, dlopen it, call it,
    # and ASSERT the one true integer result. The byte-identity keystone proves
    # two builds AGREE; this gate proves the compiled code actually COMPUTES the
    # right answer — it catches a silent miscompile that is self-consistent
    # across substrates (e.g. a wrong operator lowering) and would otherwise ship
    # green. The "Verify toolchain on PATH" step below is the fail-closed guard:
    # a missing MLIR toolchain makes `mindc build` error, so the gate cannot pass
    # vacuously. (MIND_BENCH_REQUIRE is only read by the Rust test harnesses, not
    # `mindc build`, so it would be inert in this job — deliberately omitted.)
    env:
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-exec-gate-${{ hashFiles('**/Cargo.toml', 'src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-exec-gate-

      - name: Install MLIR toolchain (Ubuntu 24.04 LLVM 20)
        run: |
          # ports.ubuntu.com (arm64 mirror) has transient outages that red the
          # ARM leg on an UPSTREAM issue, not a code defect. Retry up to 5x with
          # backoff + --fix-missing before failing; the byte-identity assertion
          # itself is unchanged.
          ok=0
          for attempt in 1 2 3 4 5; do
            sudo apt-get update || true
            if sudo apt-get install -y --fix-missing mlir-20-tools clang-20; then ok=1; break; fi
            echo "apt attempt $attempt failed (mirror outage?); retry in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "MLIR toolchain unavailable after 5 attempts (upstream apt mirror outage)"; exit 1; }
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain on PATH
        run: |
          # `tool --version | head -1` is NOT a verification: without pipefail the
          # pipeline's status is head's, so an ABSENT or broken tool exits 0 and
          # this step -- whose entire job is catching a toolchain that never made
          # it onto PATH -- passes. (The GitHub default shell is `bash -e {0}`;
          # pipefail is only on when a step sets `shell: bash` or asks for it.)
          # Run each tool WITHOUT a pipe so `-e` sees its real status, and check
          # presence explicitly; head then reads a file and cannot mask anything.
          # Not `set -o pipefail` on the original pipes: `head -1` closes early
          # and would SIGPIPE the tool, trading a false pass for a false failure.
          set -e
          for t in mlir-opt mlir-translate clang; do
            command -v "$t" >/dev/null || { echo "FAIL: $t is not on PATH"; exit 1; }
            "$t" --version > /tmp/toolver.txt
            head -1 /tmp/toolver.txt
          done

      - name: Build mindc (MLIR backend)
        run: |
          cargo build --release --no-default-features \
            --features "mlir-build std-surface cross-module-imports" --bin mindc

      # The gate owns compilation and uses a unique temporary output.  Keeping
      # the build and execution in one invocation prevents a stale or caller-
      # supplied .so from satisfying this release-required check.
      - name: Compile kernel + run + assert known output (285)
        run: |
          python3 scripts/run_gate.py examples/native/ci_kernel_smoke.py
        working-directory: ${{ github.workspace }}

  executable_semantics_tier:
    name: Executable-semantics test tier (mlir-build)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # build ~317 test harnesses + run ~1913 tests; bound stalls

    # THE TIER THAT RAN NOWHERE. Measured at f2a2d87d: 123 integration-test files /
    # 262 test functions were reachable by NO `cargo test` invocation in this
    # workflow or in scripts/preflight.sh. Every broad `cargo test` above runs
    # `--no-default-features` with at most {std-surface, cross-module-imports,
    # autodiff, mlir-lowering, cpu-buffers}; the only runs that enable `mlir-build`
    # (in cross_substrate_identity, mindfuzz_cross_runner_identity and
    # mindcraft_self_host) are `--test <single-target>` SELECTORS, and exactly
    # ONE of the 110 mlir-build-gated files (cross_substrate_identity) is named by
    # one. A file-level `#![cfg(all(unix, feature = "mlir-build", ...))]` that is
    # unsatisfied ERASES the file, and cargo still prints `ok. 0 passed` and exits 0.
    #
    # Consequence, measured, not theorised:
    #   $ cargo test --no-default-features --features std-surface,cross-module-imports \
    #       --test alias_miscompile_run --test array_oob_trap_run
    #   running 0 tests / test result: ok. 0 passed ...   (alias-miscompile gate)
    #   running 0 tests / test result: ok. 0 passed ...   (array-OOB trap gate)
    #   CARGO EXIT=0
    # The alias-miscompile gate and the ARRAY_OOB_CONTRACT=DETERMINISTIC_BOUNDS_TRAP
    # gate were EMPTY HARNESSES in every CI run. A lowering regression that made
    # `a[i]` skip its bounds check, or reintroduced the alias miscompile, was caught
    # by nothing.
    #
    # The gate body lives in scripts/exec_semantics_gate.sh so this job and the
    # matching preflight step cannot drift apart. It asserts a POSITIVE test count
    # (>= a floor) — a `--test` selector alone is NOT proof a gate ran — and triages
    # every failing target against an explicit, shrink-only quarantine list whose
    # entries each name a root cause. Any failure outside that list reds this job.
    #
    # NOT covered here, deliberately:
    #   * `mlir-gpu` (tests/mlir_gpu.rs) and `mlir-jit` (tests/mlir_jit.rs) — 1 test
    #     each; both need a GPU / an MLIR JIT runtime that hosted runners do not
    #     have. Genuinely environment-gated.
    # Covered by the sibling steps below rather than the main tier, because their
    # feature combos are disjoint from it:
    #   * std-surface + mlir-lowering  (8 files, ~53 tests) — no CI run enabled BOTH.
    #   * pkg                          (2 files, 2 tests)   — CI only `cargo check`ed it.

    env:
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      # A VNNI-capable runner must execute the manifest-bound VPDPBUSD case
      # instead of failing its required native-verification opt-in.
      MIND_INTDOT_VNNI_VERIFY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: cfg-gate wiring contract (scripts/cfg_gate_wiring_lint.py)
        # Guards the SCOPE of this job the way smoke_wiring_lint.py guards the
        # smoke corpus. The tiers below are a hand-written list of feature sets;
        # nothing in them notices a NEW `#![cfg(all(unix, feature = "..."))]` test
        # file whose feature combo no tier enables — cargo would build it as an
        # empty harness and print `ok. 0 passed`, exit 0, exactly as before.
        # The lint DERIVES the required set from tests/*.rs, resolves what this
        # workflow actually enables (including, transitively, the feature graph in
        # Cargo.toml and the tier feature sets read out of
        # scripts/exec_semantics_gate.sh itself), and fails on any file no run can
        # reach. Pure text analysis, so it runs FIRST and fails in seconds instead
        # of after the ~45-minute build.
        run: python3 scripts/run_gate.py scripts/cfg_gate_wiring_lint.py
        working-directory: ${{ github.workspace }}

      - name: Tier gate must fail CLOSED on a failing test (mutation proof)
        # The tiers below can only gate what the script GRADES. Its triage used to
        # match one cargo shape, `--test <name>`, so a failing lib unit test,
        # doctest or bin test (cargo says `--lib` / `--doc` / `--bin <n>`) was
        # attributed to nothing, cargo's exit status was printed and never
        # compared, and the aggregate `failed` count was printed and never
        # asserted — a tier could print `failed=3` and `ok[exec]` together.
        # scripts/test_exec_semantics_gate.py replays synthetic tier logs through
        # the real script's --from-log mode and asserts the EXIT CODE for each
        # case, including a positive control and the quarantine / env-tolerated
        # paths that must stay green. Pure text analysis: seconds, before the
        # ~45-minute build, like the lint above.
        run: python3 scripts/run_gate.py scripts/test_exec_semantics_gate.py
        working-directory: ${{ github.workspace }}

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-exec-sem-${{ hashFiles('**/Cargo.toml', 'src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-exec-sem-

      - name: Install MLIR toolchain (Ubuntu 24.04 LLVM 20)
        run: |
          # ports.ubuntu.com has transient outages that red a leg on an UPSTREAM
          # issue, not a code defect. Retry up to 5x with backoff before failing.
          ok=0
          for attempt in 1 2 3 4 5; do
            sudo apt-get update || true
            if sudo apt-get install -y --fix-missing mlir-20-tools clang-20; then ok=1; break; fi
            echo "apt attempt $attempt failed (mirror outage?); retry in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "MLIR toolchain unavailable after 5 attempts (upstream apt mirror outage)"; exit 1; }
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain on PATH
        # Fail-closed guard: MIND_BENCH_REQUIRE=1 (set by the gate script) turns a
        # missing MLIR toolchain into a hard failure inside the harnesses, and this
        # step catches it before the 45-minute build even starts.
        run: |
          # `tool --version | head -1` is NOT a verification: without pipefail the
          # pipeline's status is head's, so an ABSENT or broken tool exits 0 and
          # this step -- whose entire job is catching a toolchain that never made
          # it onto PATH -- passes. (The GitHub default shell is `bash -e {0}`;
          # pipefail is only on when a step sets `shell: bash` or asks for it.)
          # Run each tool WITHOUT a pipe so `-e` sees its real status, and check
          # presence explicitly; head then reads a file and cannot mask anything.
          # Not `set -o pipefail` on the original pipes: `head -1` closes early
          # and would SIGPIPE the tool, trading a false pass for a false failure.
          set -e
          for t in mlir-opt mlir-translate clang; do
            command -v "$t" >/dev/null || { echo "FAIL: $t is not on PATH"; exit 1; }
            "$t" --version > /tmp/toolver.txt
            head -1 /tmp/toolver.txt
          done

      # run_gate-exempt: scripts/exec_semantics_gate.sh - a cargo-test driver, not
      # an assert-gate: it selects harnesses and hands the verdict to cargo, which
      # publishes its own executed/failed counts, and the tier's non-vacuity is
      # asserted separately by scripts/cfg_gate_wiring_lint.py (every feature-gated
      # test file must be reachable from a selector this script defines).
      - name: Tier 'exec' — executable semantics (mlir-build)
        # 110 mlir-build-gated files, including the alias-miscompile gate and the
        # ARRAY_OOB_CONTRACT=DETERMINISTIC_BOUNDS_TRAP gate. measured@f2a2d87d:
        # 317 harnesses / 1913 tests executed. Floor asserted inside the script.
        run: scripts/exec_semantics_gate.sh exec

      - name: Tier 'lowering' — std-surface + mlir-lowering
        # 8 files / ~53 tests carry `#![cfg(all(feature = "std-surface",
        # feature = "mlir-lowering"))]`. This workflow runs each of those features
        # ALONE (the 'Test (gated ...)' and 'Run gated tests ...' steps of the
        # build_test job) and never together, so the whole group was
        # erased in both runs. measured@f2a2d87d: 318 harnesses / 1663 executed.
        run: scripts/exec_semantics_gate.sh lowering

      - name: Tier 'pkg' — package resolver
        # tests/package_basic.rs + tests/package_traversal.rs are `#![cfg(feature =
        # "pkg")]`. The feature-compile matrix above runs `cargo check --features
        # pkg` but never `cargo test`, so neither had ever executed.
        # measured@f2a2d87d: 317 harnesses / 1265 executed.
        run: scripts/exec_semantics_gate.sh pkg

      - name: Upload raw executable-semantics tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exec-semantics-tier-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/mind-tier-*.log
          if-no-files-found: warn
          retention-days: 7

  # Gate & merge integrity. These are text-only checks (git + python3 stdlib), so
  # they run in seconds and need no toolchain — there is no reason for them to live
  # only in a developer's preflight. Both exist because of a measured incident: a
  # merge deleted a security ENFORCEMENT line while its enum variant, Display arm,
  # error mapping AND its test all survived, so nothing failed to compile and the
  # test kept passing over a rule that no longer existed.
  ri_d1_mlir_free:
    name: RI-D1 MLIR-free native path (MLIR compiled out)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # THE STRONGEST LEG OF THE RI DEPENDENCY-CUT, and until now it was asserted
    # by prose only: scripts/ri_d1_mlir_free_gate.sh was referenced by ANATOMY.md
    # and docs/RI_DEPENDENCY_MATRIX.md and executed by no workflow, no preflight
    # step and no hook.
    #
    # Every other RI-D evidence step observes at RUNTIME that no toolchain was
    # spawned. This one removes the possibility BY CONSTRUCTION: it rebuilds mindc
    # with `mlir-build` compiled OUT, so src/eval/mlir_build.rs is not in the
    # binary at all. If the native path secretly depended on MLIR the binary would
    # fail to LINK, and a "silent MLIR fallback" has nothing to fall back to.
    #
    # Deliberately NOT folded into mindcraft_self_host: that job installs the LLVM
    # 20 toolchain and builds WITH mlir-build, and this gate's whole claim is a
    # second, MLIR-free cargo profile (target/mlir-free). Sharing a job would
    # share a target dir and blur exactly the distinction being proved.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mlir-free
          key: ${{ runner.os }}-ri-d1-mlir-free-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-ri-d1-mlir-free-

      - name: Install strace (the gate's observation instrument)
        # The gate exits 2 = BLOCKED when strace, cargo or the frozen stage1.elf
        # is missing. BLOCKED is a developer-local outcome meaning "not measured";
        # in CI it must never be mistaken for a pass, so the instrument is
        # installed up front and the run step below maps 2 to FAILURE explicitly.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends strace

      - name: MLIR un-linkable on the native path (ri_d1_mlir_free_gate.sh)
        run: |
          set +e
          python3 scripts/run_gate.py scripts/ri_d1_mlir_free_gate.sh
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::RI-D1 MLIR-free gate exited 2 (BLOCKED) — a prerequisite"
            echo "::error::was missing, so the MLIR-free claim was NOT measured."
            echo "::error::An unmeasured claim is a FAILURE in CI, never a pass."
            exit 1
          fi
          exit "$rc"
        working-directory: ${{ github.workspace }}

      - name: Pure-MIND v04 body differential gate
        # Uses the committed native compiler and reference-generated corpus.
        # Seventy-two verdicts plus twenty-two byte comparisons must execute.
        run: python3 scripts/run_gate.py --min-asserted 94 examples/mind_mirror_v04/mirror_gate.py
        working-directory: ${{ github.workspace }}

      - name: Pure-MIND v04 scoped semantic boundary gate
        # Twenty-nine verdicts plus ten byte comparisons, separate from wire parity.
        run: python3 scripts/run_gate.py --min-asserted 39 examples/mind_mirror_v04/mirror_gate.py --semantic
        working-directory: ${{ github.workspace }}

  sdlc_integrity:
    name: SDLC gate integrity (merge + enforcement pairing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lost_by_merge needs BOTH parents of a merge commit; a shallow clone
          # would silently reduce the check to "not a merge, ran=0" — which the
          # script reports honestly, but which would gate nothing.
          fetch-depth: 0

      - name: Lines dropped by a merge that BOTH parents had
        # --min-asserted 0: this gate is conditional BY DESIGN — on a non-merge HEAD
        # there is no merge to audit, and it correctly reports `ran=0`. That is "not
        # applicable", not "checked nothing", and it is the ONLY exemption from the
        # runner's N>=1 rule here; every other gate in this job must publish a
        # non-zero assertion count.
        run: python3 scripts/run_gate.py --min-asserted 0 scripts/sdlc/lost_by_merge.py HEAD

      - name: A cargo gate is in the wiring lint's scope, or declared deferred
        # The lint above only ever looked for a repository script, so a step whose
        # gate IS `cargo test` was invisible to it: not routed, not required to be
        # declared, and not recorded anywhere as uncovered — while the lint reported
        # that every gate invocation reaches the runner. Two live vacuity holes sit
        # in that gap (a capability skip inside a Rust test; the fuzzer's missing
        # program-count floor). They stay open, and this gate keeps them WRITTEN
        # DOWN: a cargo exemption must name the upgrade path that ends it, and
        # deleting the declaration from this file fails the job.
        # Folded into the lint itself (`--self-test`): a gate and its mutation
        # proof are one artifact, so the proof cannot be dropped while the gate
        # keeps riding green.
        run: python3 scripts/run_gate.py scripts/gate_runner_wiring_lint.py --self-test

      - name: Enforcement/test pairing (a test must not outlive its rule)
        run: python3 scripts/run_gate.py scripts/sdlc/enforcement_bijection.py

      - name: Feature-gated tests must be reachable from a CI selector
        run: python3 scripts/run_gate.py scripts/cfg_gate_wiring_lint.py

      - name: IR operand visitors must not drift apart
        run: python3 scripts/run_gate.py scripts/operand_visitor_parity_lint.py

      - name: A comment's enumeration must match the code it describes
        # The tc_let shape: `parse_let` said ty=0 was "the exact no-annotation value
        # every let consumer already handles" and NAMED them; tc_let was not among
        # them, read ast_span_lo(0), and died 21 times over four days. A comment that
        # counts or names a set is checked by nothing. This pins two such sets that
        # had ALREADY rotted (a 23-vs-25 keyword count, a "these five" beside a
        # nine-key allowlist) to the code that owns them.
        run: python3 scripts/run_gate.py scripts/enumeration_drift_lint.py

      - name: A gate may be reached only through the gate runner
        # scripts/run_gate.py is what turns "exit 0" into "exited 0 AND published
        # asserted=<N> AND announced no SKIP". That guarantee is worth exactly as
        # many call sites as go through it, and the conversion had stopped half-way:
        # 11 workflow steps still invoked a gate directly, two of them vacuously
        # (tests/check_claims_gate_tests.py reported nine mutation cases in a
        # vocabulary the counter does not read -> asserted=0;
        # scripts/check_release_gating.py printed a hand-typed six-rule list
        # unconditionally). This lint fails on any direct invocation that is not
        # declared, in the workflow itself, with a written reason.
        run: python3 scripts/run_gate.py scripts/gate_runner_wiring_lint.py

      - name: Smoke-wiring lint must reject a gate that reaches no CI
        # scripts/test_smoke_wiring_lint.py builds miniature fixture repos and
        # runs the REAL lint against them, pinning two holes that let a GREEN
        # lint certify an UNEXECUTED gate: a class=gate row wired only to the
        # developer-local keystone/preflight runners, and an "runs
        # UNCONDITIONALLY" claim written from inside preflight.sh's `--full`
        # branch. Both were live defects; the fixtures encode the exact shapes.
        #
        # Non-vacuity: two of its five cases are controls that must stay GREEN,
        # so a lint stubbed to always fail is caught as surely as one stubbed to
        # always pass. It prints ran=/fail= counts, never a bare exit code.
        run: python3 scripts/run_gate.py scripts/test_smoke_wiring_lint.py

      - name: Bench gate must fail CLOSED on a missing measurement
        # tools/test_bench_gate.py asserts the fail-closed contract of
        # tools/bench_gate.py: an empty / truncated bench.out or a missing
        # baseline must exit 4, never fall through to "bench gate: PASS".
        #
        # It lives HERE, not in bench-gate.yml, for two reasons. bench-gate.yml
        # runs behind a `paths:` filter and needs a ~30-minute criterion run
        # before it reaches the gate at all; and it is absent from
        # .github/required-ci-jobs.tsv, so its verdict cannot block a release.
        # This job is in that manifest and needs no toolchain, so the contract is
        # checked on every push and a release is verified against it.
        #
        # Non-vacuity (measured): against a bench_gate.py stubbed to always
        # `exit 0` — exactly the vacuous-PASS hole this defends — the three
        # fail-closed cases go red and the runner exits 1.
        run: python3 scripts/run_gate.py tools/test_bench_gate.py

  conformance:
    name: Core v1 conformance suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking gate for the Core v1 conformance suite (docs/versioning.md sells a
    # passing profile as evidence of API/IR/MLIR stability for that profile, so
    # the suite has to actually run somewhere). Two assertions, because an exit
    # code alone cannot tell "everything passed" from "nothing ran":
    #   1. `--profile cpu` exits 0 AND reports a non-zero case count.
    #   2. `--profile gpu` exits NON-ZERO on this build, which carries no
    #      `mlir-gpu` feature and therefore has zero GPU cases compiled in.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-conformance-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-conformance-

      - name: Build mindc
        run: cargo build --release --bin mindc

      - name: CPU profile must pass with a non-zero case count
        run: |
          set -euo pipefail
          out=$(./target/release/mindc conformance --profile cpu)
          echo "$out"
          case "$out" in
            *"ran=0"*)
              echo "::error::conformance reported a pass having run zero cases"
              exit 1
              ;;
            *"ran="*) ;;
            *)
              echo "::error::conformance did not report a case count"
              exit 1
              ;;
          esac

      - name: GPU profile must fail closed with zero GPU cases compiled in
        run: |
          set -uo pipefail
          if ./target/release/mindc conformance --profile gpu >gpu.out 2>gpu.err; then
            echo "::error::gpu profile printed a pass with no GPU cases compiled in"
            cat gpu.out
            exit 1
          fi
          cat gpu.err
          grep -qi "no GPU cases compiled in" gpu.err

  mindcraft_check:
    name: Mindcraft check (RFC 0007 Phase 6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking gate: `mindc check` over std/ + production examples/ must be
    # error-clean. Deliberate native record-array refusal/reference programs
    # live under the VCS-ignored test corpus and are exercised by their
    # dedicated native gate above.
    # Cross-module import resolution (see the build step) lets the project-level
    # check see symbols declared in sibling std modules, so the tree now checks
    # with zero error-severity diagnostics — the `continue-on-error` rollout flag
    # is removed. Lint-level warnings remain non-fatal by design (the check exits
    # non-zero only on error-severity diagnostics).

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mindcraft-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-mindcraft-

      - name: Build mindc
        # std-surface enables the while/for/region parser arms used in std/ and
        # examples/. cross-module-imports seeds the whole-project module table so
        # the check resolves symbols declared in sibling modules (e.g. a file that
        # does `import std.sha256`) instead of reporting spurious E2003
        # undefined-call errors — a project-level check would otherwise be
        # stricter than a build. Without either feature the check rejects valid
        # MIND source and exits non-zero.
        run: cargo build --release --no-default-features --features "std-surface cross-module-imports" --bin mindc

      - name: Run mindc check on std/ and examples/
        run: |
          cargo run --release --no-default-features --features "std-surface cross-module-imports" --bin mindc -- \
            check std/ examples/

  # MSRV check temporarily disabled - ar_archive_writer 0.5.x requires nightly features
  # Will re-enable when stable Rust supports edition 2024 let-chains
  # msrv:
  #   name: Minimum Supported Rust Version
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v5
  #
  #     - name: Install Rust 1.85
  #       uses: dtolnay/rust-toolchain@1.85
