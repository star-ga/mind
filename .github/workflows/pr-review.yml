name: pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    # Same-repo branches only: fork PRs never get an identity token or model access.
    # Dependabot PRs are skipped: they get no repository secrets, and their diffs are version bumps.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Collect the diff
        run: |
          git diff "$BASE...$HEAD" > /tmp/pr.diff
          git log --format='%an <%ae>%n%B' "$BASE..$HEAD" > /tmp/pr.log
          jq -r '.pull_request.title, (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > /tmp/pr.meta
          wc -c /tmp/pr.diff /tmp/pr.log
      - name: Mint the identity token
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          echo "::add-mask::$token"
          echo "ANTHROPIC_IDENTITY_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Review and leak check
        run: |
          python3 -m pip install --quiet --upgrade anthropic
          # With a subscription token the review runs through the Claude Code CLI (no API credit used).
          # The CLI prefers the workload-identity variables over the subscription token, so drop them on that path.
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then npm install -g --silent @anthropic-ai/claude-code@2.1.311
            unset ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_IDENTITY_TOKEN; fi
          # The checker runs from the base branch once it exists there, so a PR cannot weaken its own check.
          # run_gate-exempt: scripts/pr_review.py - (.github/scripts/pr_review.py) its stdout IS the review
          # comment body posted by the next step, so runner lines must not be appended to it; its leak verdict
          # goes to /tmp/leaks.txt, which the "Fail on a leak" step enforces and which is non-empty (red) when
          # the leak list is missing, so an unchecked run cannot pass.
          git show "$BASE:.github/scripts/pr_review.py" > /tmp/pr_review.py 2>/dev/null || cp .github/scripts/pr_review.py /tmp/pr_review.py
          # A stale verdict must not stand in for one this run produced.
          rm -f /tmp/leaks.txt
          # Outside the checkout, so the base-branch script's single-turn CLI call does not stop on file reads.
          rc=0; (cd "$(mktemp -d)" && python3 /tmp/pr_review.py) > /tmp/review.md 2> /tmp/review.err || rc=$?
          cat /tmp/review.err >&2
          if [ "$rc" != 0 ]; then
            # On the token path, show the CLI's own error (stdout) so a failed review is diagnosable.
            # Same isolation as the call above: empty directory, no tools, ANTHROPIC_* stripped; never changes the exit code.
            if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
              (cd "$(mktemp -d)" && env $(env | grep -o '^ANTHROPIC_[A-Z_]*' | sed 's/^/-u /') \
                sh -c 'echo "Reply OK" | claude -p --tools "" --max-turns 1 --output-format text' 2>&1 | head -c 400) || true
              echo; fi
            # The script writes /tmp/leaks.txt before it calls the model, so the file exists only when the leak
            # check completed and the advisory model review alone is missing. Post that verdict (pattern numbers
            # only) with the script's own redacted reason and let "Fail on a leak" rule on it; the job stays red
            # when the leak check itself never ran.
            test -f /tmp/leaks.txt || exit "$rc"
            reason=$(grep -m1 '^review model call failed' /tmp/review.err | head -c 300 || true)
            { echo '<!-- pr-review -->'; echo '### Automated review'; echo
              if [ -s /tmp/leaks.txt ]; then
                echo '**Leak check: FAILED.** Private or attribution text found in this PR (pattern numbers only, so this public comment repeats nothing):'; echo
                sed 's/^/- /' /tmp/leaks.txt; echo; echo
              else echo '**Leak check: passed.**'; echo; fi
              echo "**Model review: unavailable for this run** (${reason:-see the review job log}). The leak check above ran and is enforced; the model review is advisory and runs again on the next push."
            } > /tmp/review.md
          fi
      - name: Post or update the review comment
        run: |
          marker='<!-- pr-review -->'
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@/tmp/review.md > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -F body=@/tmp/review.md > /dev/null
          fi
      - name: Fail on a leak
        run: test ! -s /tmp/leaks.txt
