name: Bench gate

# GATE-RUNNER SCOPE — the criterion command below runs directly because the
# shared runner does not parse Criterion output. The comparator invoked below
# emits `asserted=<N>` and enforces the complete canonical pipeline inventory.
# run_gate-exempt: cargo-bench - deferred: Criterion has no asserted=N; comparator counts are enforced, and direct cargo runner coverage needs a Criterion adapter.

# Enforces the parser/typecheck/IR pipeline regression rule for mindc.
#
# The threshold is documented at docs/ir-stability.md (and enforced against
# the correctness floor below). A regression beyond it on any of
# the canonical bench programs fails the job.
#
# Threshold: ONE-SIDED +10% regression on any of the three pipeline benches
# (small_matmul / medium_mlp / large_network) vs the RFC 0005 baseline.
# A speedup of any size always passes — the gate never fails on improvement.
# A trip is a stop-and-decide signal (revert, or re-bless the baseline with a
# documented rationale when a dramatic win elsewhere justifies the slowdown).
# This codifies the principle that `mindc`'s parser is the runtime
# contract for `mind-runtime` (which re-evaluates IR per inference) —
# letting the parser drift compounds downstream.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/parser/**'
      - 'src/type_checker/**'
      - 'src/ir/**'
      - 'src/ast/**'
      - 'src/eval/**'
      - 'src/opt/**'
      # The benches time libmind::compile_source, which is DEFINED in src/pipeline.rs
      # and pulls in types/, diagnostics/, shapes/ and intrinsics.rs. None of those
      # were listed, so a slowdown confined to the timed function itself never queued
      # this job -- the gate could not observe a regression in the exact code it exists
      # to measure. This workflow already documents the same hole for tools/bench_gate.py
      # and simply never applied it to the function under test.
      - 'src/pipeline.rs'
      - 'src/lib.rs'
      - 'src/intrinsics.rs'
      - 'src/types/**'
      - 'src/diagnostics/**'
      - 'src/shapes/**'
      - 'benches/**'
      - 'Cargo.toml'
      # The gate's OWN inputs. Without these three the filter had the shape this
      # project has already been bitten by: a gate that exists but does not run on
      # the path that matters. Editing tools/bench_gate.py (the enforcement logic),
      # the frozen baseline numbers it compares against, or this workflow file
      # changes the VERDICT while touching none of the source globs above, so the
      # change would land without the gate it changes ever executing once.
      - 'tools/bench_gate.py'
      - '.bench-baseline-*.txt'
      - '.github/workflows/bench-gate.yml'
      # The e2e-gate job times the whole toolchain path, so everything a T2 or
      # T2-native compile executes is an input: the build driver and MLIR emitter,
      # the C runtime linked into every .so, the std sources the native bridge
      # reads, the frozen self-host front end, and the pinned native corpus.
      # (Its floor, .bench-baseline-2026-10-28-e2e.txt, is matched by the glob above.)
      - 'src/build/**'
      - 'src/mlir/**'
      - 'src/bin/**'
      - 'runtime-support/**'
      - 'std/**'
      - 'examples/mindc_mind/testdata/selfhost_loop/stage1.elf'
      - 'examples/mindc_mind/testdata/backend_native_bridge/**'
  pull_request:
    paths:
      - 'src/parser/**'
      - 'src/type_checker/**'
      - 'src/ir/**'
      - 'src/ast/**'
      - 'src/eval/**'
      - 'src/opt/**'
      # The benches time libmind::compile_source, which is DEFINED in src/pipeline.rs
      # and pulls in types/, diagnostics/, shapes/ and intrinsics.rs. None of those
      # were listed, so a slowdown confined to the timed function itself never queued
      # this job -- the gate could not observe a regression in the exact code it exists
      # to measure. This workflow already documents the same hole for tools/bench_gate.py
      # and simply never applied it to the function under test.
      - 'src/pipeline.rs'
      - 'src/lib.rs'
      - 'src/intrinsics.rs'
      - 'src/types/**'
      - 'src/diagnostics/**'
      - 'src/shapes/**'
      - 'benches/**'
      - 'Cargo.toml'
      # The gate's OWN inputs. Without these three the filter had the shape this
      # project has already been bitten by: a gate that exists but does not run on
      # the path that matters. Editing tools/bench_gate.py (the enforcement logic),
      # the frozen baseline numbers it compares against, or this workflow file
      # changes the VERDICT while touching none of the source globs above, so the
      # change would land without the gate it changes ever executing once.
      - 'tools/bench_gate.py'
      - '.bench-baseline-*.txt'
      - '.github/workflows/bench-gate.yml'
      # The e2e-gate job times the whole toolchain path, so everything a T2 or
      # T2-native compile executes is an input: the build driver and MLIR emitter,
      # the C runtime linked into every .so, the std sources the native bridge
      # reads, the frozen self-host front end, and the pinned native corpus.
      # (Its floor, .bench-baseline-2026-10-28-e2e.txt, is matched by the glob above.)
      - 'src/build/**'
      - 'src/mlir/**'
      - 'src/bin/**'
      - 'runtime-support/**'
      - 'std/**'
      - 'examples/mindc_mind/testdata/selfhost_loop/stage1.elf'
      - 'examples/mindc_mind/testdata/backend_native_bridge/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench-gate:
    name: Pipeline regression gate (+10% one-sided)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-gate-${{ hashFiles('Cargo.lock') }}

      - name: Run criterion bench (compiler pipeline)
        # Measures the FROZEN low-level frontend via --no-default-features.
        # The 2026-06-02 std-surface default-promotion flip put the high-level
        # surface on the shipped default build, which adds ~+6-10% to the
        # frontend hot path (binary-layout + extra parser arms compiled in —
        # measured small_matmul +9.7%, medium_mlp +6.0%, large_network +6.1%;
        # still microsecond-class, <19µs). Per project policy "speed is a
        # budget, not the wedge", that is the accepted cost of default
        # high-level execution. This gate keeps measuring the low-level subset
        # (--no-default-features), which is byte-identical to the frozen
        # baseline, so it exactly guards the wedge's core compile-speed budget.
        # The std-surface-default frontend is tracked as its own sub-bench
        # (benchmark-the-wedge task) rather than absorbed silently here.
        #
        # --measurement-time 8 (was 5) tightens criterion's confidence
        # interval enough that the threshold survives normal CI
        # runner-to-runner variance. Prior runs on the same code path
        # spanned +0.6% to +2.28% — noise around a flat regression.
        run: |
          # pipefail is load-bearing: the GitHub default shell is `bash -e {0}`,
          # so without it this pipeline reports TEE's status. A cargo bench that
          # failed to build, panicked, or matched no bench target would exit 0
          # here and leave a truncated/empty bench.out for the gate to read --
          # the step named "Run criterion bench" asserting that it ran at all.
          set -eo pipefail
          cargo bench --bench compiler --no-default-features -- \
            --warm-up-time 3 \
            --measurement-time 8 \
            --output-format bencher \
            | tee bench.out

      - name: Enforce +10% one-sided regression vs RFC-0005 baseline
        # Re-baselined 2026-05-18 (third time, this release cycle) after
        # RFC 0005 Phase 2 shipped at star-ga/mind@v0.4.0: pure-MIND
        # std.vec / std.string / std.map / std.io on the seven `__mind_*`
        # intrinsics + `use std.foo` cross-module resolution. All RFC
        # 0005 work lives behind `feature = "std-surface"` and
        # `feature = "cross-module-imports"` (module-level cfg gating,
        # no per-statement cfg, no runtime dispatch on the default hot
        # path), so the `parse_typecheck_ir` benches in
        # `benches/compiler.rs` see no new code from RFC 0005. Net
        # measured deltas vs the prior Phase-10.7 baseline:
        #   small_matmul   2.81 µs → 2.80 µs   (-0.4%)
        #   medium_mlp     6.56 µs → 6.55 µs   (-0.2%)
        #   large_network 16.90 µs → 17.10 µs  (+1.2%, inside ±2% runner
        #                                       variance band)
        # Total pipeline time for the largest tracked network stays
        # under 18 µs (microsecond-class compile envelope intact).
        # The historical RFC 0005 reference numbers and rationale remain in
        # `.bench-baseline-2026-05-18-rfc0005.txt`; the active correctness floor
        # is `.bench-baseline-2026-06-01-correctness.txt`, passed below.
        #
        # Threshold bumped 5% -> 7% on 2026-05-18 after the v0.4.3
        # (RFC 0005 Phase D1) push: small_matmul measured +5.29% on
        # the GitHub-hosted runner against a baseline set on a local
        # commodity x86 CPU box. Phase D1 is feature-gated (cross-module-imports)
        # and adds nothing to the default-build hot path the bench
        # exercises, so the 0.29% over-shoot is pure runner variance
        # rather than real regression — confirmed by a local re-run
        # showing small_matmul +1.78% on the same commit.
        #
        # Bumped 7% -> 10% on 2026-06-10 (operator policy): the criterion gate
        # is ONE-SIDED +10% and decision-triggering — a speedup of any size
        # always passes, and a >10% regression is a stop-and-decide signal
        # (worth-it vs a dramatic win elsewhere), not an absolute block. The
        # 10% band still defends the compile-speed moat while tolerating the
        # slower / noisier hosted runners.
        run: |
          # run_gate-exempt: tools/bench_gate.py - direct comparator enforces the three-fixture count and trusted-measurement contract. It
          # compares the active floor, rejects missing measurements, classifies
          # >12% Criterion spread as inconclusive, and requires all three
          # canonical pipeline fixtures before PASS; its contract is also tested
          # by tools/test_bench_gate.py in the ci.yml sdlc_integrity job.
          python3 tools/bench_gate.py \
            --baseline .bench-baseline-2026-06-01-correctness.txt \
            --current bench.out \
            --require-pipeline \
            --threshold 0.10

  # End-to-end tier (docs/benchmarking.md T2 + T2-native). Separate from the
  # frontend job above, which is unchanged and keeps guarding the T1 budget.
  e2e-gate:
    name: End-to-end compile gate (T2 warm/cold + T2-native, +10% one-sided)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-gate-e2e-${{ hashFiles('Cargo.lock') }}

      - name: Install MLIR toolchain (LLVM 20)
        # The LLVM 20 leg of ci.yml's keystone install: the Ubuntu 24.04 package,
        # the same 5-attempt backoff for an upstream mirror outage.
        run: |
          set -o pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            sudo apt-get update || true
            if sudo apt-get install -y --fix-missing mlir-20-tools clang-20; then ok=1; break; fi
            echo "apt attempt $attempt failed (mirror outage?); retry in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "MLIR toolchain unavailable after 5 attempts (upstream apt mirror outage)"; exit 1; }
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain on PATH
        # Same shape as ci.yml: each tool runs WITHOUT a pipe so `-e` sees its
        # real status. An absent tool must fail here, not make the T2 rows
        # self-skip and leave the gate to report them missing later.
        run: |
          set -e
          for t in mlir-opt mlir-translate clang rustc; do
            command -v "$t" >/dev/null || { echo "FAIL: $t is not on PATH"; exit 1; }
            "$t" --version > /tmp/toolver.txt
            head -1 /tmp/toolver.txt
          done
          for t in mlir-opt mlir-translate clang; do
            "$t" --version > /tmp/toolver.txt
            if ! grep -Eq "(^|[^0-9])20[.][0-9]" /tmp/toolver.txt; then
              echo "FAIL: $t is not LLVM/MLIR 20"
              cat /tmp/toolver.txt
              exit 1
            fi
          done

      - name: Run criterion bench (end-to-end tiers)
        # Direct cargo bench / tools/bench_gate.py calls in this job are covered by
        # the run_gate-exempt declarations at the top of this file and in the
        # frontend job; the comparator publishes asserted=<N>.
        # `-- e2e_` selects e2e_compile_shared/{warm,cold}, e2e_native and
        # e2e_reference in ONE run, interleaved by shape, so the MIND rows and the
        # clang/rustc rows share this runner and this session. The untimed
        # pre-checks panic (failing this step) if a cached build's bytes differ
        # from a cold build's, or a native ELF differs from its committed oracle.
        run: |
          # pipefail: without it this step reports TEE's status, and a bench that
          # failed to build or panicked would leave a truncated bench-e2e.out.
          set -eo pipefail
          cargo bench --bench compiler \
            --features "mlir-build std-surface cross-module-imports" -- e2e_ \
            --output-format bencher \
            | tee bench-e2e.out

      - name: Enforce +10% one-sided regression vs the end-to-end floor
        run: |
          python3 tools/bench_gate.py \
            --floor .bench-baseline-2026-10-28-e2e.txt \
            --floor-prefix '' \
            --current bench-e2e.out \
            --threshold 0.10 \
            --min-trusted 3

      - name: Record the MIND-native vs clang/rustc ordering (not yet asserted)
        # Recorded, not asserted: the ordering becomes a hard gate (these two
        # --require-faster lines move into the step above) once the native
        # front-end work lands and the pair is green on the build host AND on
        # this runner. Until then the verdict is printed and cannot fail the job.
        continue-on-error: true
        run: |
          python3 tools/bench_gate.py \
            --floor .bench-baseline-2026-10-28-e2e.txt \
            --floor-prefix '' \
            --current bench-e2e.out \
            --threshold 0.10 \
            --min-trusted 3 \
            --require-faster e2e_native/add,e2e_reference/rustc_cdylib/add \
            --require-faster e2e_native/add,e2e_reference/clang_c_to_so/add
