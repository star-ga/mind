name: Crypto Vectors

# RFC known-answer-test (KAT) gate for the pure-MIND crypto/TLS std modules.
#
# ~7,500 LOC of pure-MIND cryptography (SHA-256, Keccak/SHA-3, HKDF, AES-GCM,
# ChaCha20-Poly1305, X25519, ECDSA-P256, RSA-PSS, ML-KEM-768, X.509, and the
# full TLS 1.3 key schedule / record / Finished / handshake) ship with
# official-vector drivers under tests/*_driver.py — each replays published RFC
# 8446/8448/7541/7748/8017/8439/FIPS-203 vectors (cross-checked against an
# independent reference: pyca/cryptography, python-hpack, kyber-py) through the
# compiled MIND .so and compares byte-for-byte. Before this job NOTHING in CI
# ran them, so a silent crypto miscompile could ship green. This job builds
# every module to a shared object and gates on every driver's exit code: a
# single wrong KAT turns CI red.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1

jobs:
  crypto_vectors:
    name: Crypto RFC known-answer vectors (pure-MIND crypto/TLS) (LLVM ${{ matrix.llvm }})
    strategy:
      fail-fast: false
      matrix:
        llvm: ["23", "20"]
    runs-on: ubuntu-24.04
    # Own installs peaked at 27s (runs 42311708468, 42310768122, 42301093806).
    # The shared apt step also took 1022s on a successful LLVM 20 fetch
    # (148 MB in 16min 49s, run 42273645377). Rest of this job peaked at 214s.
    # 2*1022+214 = 2258s.
    timeout-minutes: 39

    # Fail-closed, exactly like the executable-miscompile and keystone gates:
    #   1. MIND_BENCH_REQUIRE=1 is set for parity with the exec-gate/keystone
    #      jobs (it turns a missing MLIR toolchain into a hard failure in any
    #      Rust harness that reads it).
    #   2. The real guard for THIS job is the "Verify toolchain on PATH" step
    #      below plus the emit path in scripts/run_crypto_vectors.sh: mindc's
    #      --emit-shared lowers MIND IR to MLIR text and shells out to
    #      mlir-opt/mlir-translate/clang. If that toolchain is missing the
    #      first `emit` in the script errors and the job aborts — it can NEVER
    #      pass vacuously with zero drivers run.
    env:
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      MIND_BENCH_REQUIRE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-crypto-vectors-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-crypto-vectors-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install reference crypto libraries
        # Independent oracles the drivers cross-check the pinned RFC vectors
        # against BEFORE comparing MIND output — so the ground truth is real,
        # not circular. kyber-py is required by mlkem768_driver.py (it exits 2
        # / BLOCKED without it, which the runner counts as FAIL — fail-closed).
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cryptography hyperframe hpack kyber-py

      - name: Install MLIR toolchain (LLVM ${{ matrix.llvm }})
        uses: ./.github/actions/install-mlir-toolchain
        with:
          llvm: ${{ matrix.llvm }}

      - name: Verify toolchain on PATH
        # Fail-closed guard: if the MLIR toolchain is absent this errors here,
        # long before any driver could be reported as "passed".
        run: |
          # `tool --version | head -1` is NOT a verification: without pipefail the
          # pipeline's status is head's, so an ABSENT or broken tool exits 0 and
          # this step -- whose entire job is catching a toolchain that never made
          # it onto PATH -- passes. (The GitHub default shell is `bash -e {0}`;
          # pipefail is only on when a step sets `shell: bash` or asks for it.)
          # Run each tool WITHOUT a pipe so `-e` sees its real status, and check
          # presence explicitly; head then reads a file and cannot mask anything.
          # Not `set -o pipefail` on the original pipes: `head -1` closes early
          # and would SIGPIPE the tool, trading a false pass for a false failure.
          set -e
          for t in mlir-opt mlir-translate clang; do
            command -v "$t" >/dev/null || { echo "FAIL: $t is not on PATH"; exit 1; }
            "$t" --version > /tmp/toolver.txt
            head -1 /tmp/toolver.txt
            if ! grep -Eq "(^|[^0-9])${{ matrix.llvm }}[.][0-9]" /tmp/toolver.txt; then
              echo "FAIL: $t is not LLVM/MLIR ${{ matrix.llvm }}"
              cat /tmp/toolver.txt
              exit 1
            fi
          done

      - name: Build mindc (MLIR backend)
        run: |
          cargo build --locked --release --no-default-features \
            --features "mlir-build std-surface cross-module-imports" --bin mindc

      - name: Run all crypto/TLS RFC vector drivers
        # Every tests/*_driver.py is executed; the script aggregates and exits
        # non-zero if ANY driver's exit code is non-zero (a wrong KAT = red).
        run: |
          # run_gate-exempt: scripts/run_crypto_vectors.sh - it already carries its own
          # corpus floor, which is the property the runner would add: it fails RED
          # when fewer than EXPECTED_DRIVERS known-answer drivers ran ("a vector gate
          # that ran no vectors asserts nothing"). Its verdict vocabulary is
          # RESULT: GREEN/RED, which the shared counter does not read.
          # deferred: move it onto the shared PASS/FAIL verdict vocabulary and route
          # it, so one contract covers this gate too.
          MINDC=./target/release/mindc scripts/run_crypto_vectors.sh
        working-directory: ${{ github.workspace }}
