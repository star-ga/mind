name: Release Drafter
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          # A pull request's merge ref is ephemeral, so v7 never publishes from
          # it; say so explicitly. On a PR this run validates the config and
          # the computed draft; only a push to main updates the draft release.
          dry-run: ${{ github.event_name == 'pull_request' }}
