[advisories]
version = 2
# No ignores: every RustSec advisory that matches the resolved graph fails the
# check. CI resolves with --all-features, so an optional dependency a release
# can ship (evidence-*, mlir-jit, ...) is audited like a default one.
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # libloading (dev-dependency, and the optional mlir-jit backend).
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
