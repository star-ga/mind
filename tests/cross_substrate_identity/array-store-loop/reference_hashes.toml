# mind-bench reference hashes — RFC 0020 §5. See u64-ops/reference_hashes.toml
# for provenance/signing notes.
#
# The F2 aggregate loop-carry canary (#320 Step D). The kernel
# `array_store_loop(base=7)` fills a fixed `[i64; 8]` via `a[k] = base*k + k*k`
# INSIDE a while-loop body (the value-semantic `tensor<8xi64>` loop iter-arg),
# then folds the eight post-loop reads in fixed source order via a wrapping
# polynomial. The canonical output is the folded i64 serialised little-endian
# (manifest `output_encoding = "i64_le"`), then sha256.
#
# This hash is the standing regression pin that the loop-carried aggregate store
# keeps working: a regression that DROPS a store (the pre-F2 silent-miscompile,
# where the post-loop read saw the pre-loop value) or threads a WRONG incarnation
# flips it, and the in-run oracle assert additionally proves the compiled kernel
# matches Rust semantics bit-for-bit. Integer store/add/mul are exact and
# order-independent, and the bufferized loop body carries NO per-iteration
# malloc/memcpy (verified on the post-bufferization LLVM IR — the tensor iter-arg
# is a self-cycling memref-descriptor phi), so avx2 == neon by construction
# (RFC 0015 §3.1).
#
# Provenance:
#   avx2 — computed on x86_64 (this reference), verified in CI job
#          `cross_substrate_identity` (ubuntu-24.04).
#   neon — SAME hash by construction; recomputed on real ARM hardware (CI job
#          `cross_substrate_identity`, ubuntu-24.04-arm) per RFC 0020 §10.
#
# Re-bless only on an intentional lowering change (RFC 0020 §13): run the gate
# with MIND_BENCH_BLESS=1 and commit the new hash.

avx2 = "50b3efb2da5eb89764302f3781d390e9121c12cb8f87faaa69f5d0f46bf39f31"
neon = "50b3efb2da5eb89764302f3781d390e9121c12cb8f87faaa69f5d0f46bf39f31"
