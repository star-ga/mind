# MIND capability manifest — SINGLE SOURCE OF TRUTH for cross-surface claims.
#
# Why this exists: external review (2026-06) found public claims that contradicted
# each other across README / STATUS / docs / site (IR versions, autodiff status,
# runtime boundary, tool counts). The root cause was hand-maintained prose in many
# places. This file is the canonical record; `scripts/check_claims.py` is a CI gate
# that fails the build if any documented surface drifts from these values.
#
# Update HERE first, then update the surfaces; the gate keeps them honest.

[ir]
# Canonical IR serialization (RFC 0014/0016/0021). The full IRModule.
canonical_text   = "mic@1"
canonical_binary = "mic@3"
# Evidence-chain trace hash anchors on canonical mic@3 BYTES (RFC 0016 GAP-1 re-anchor,
# 2026-05-31) — NOT on mic@1 text, NOT on the v2/v2.1 forms.
trace_hash_anchor = "mic@3"
# Legacy dataflow lineage — DEMOTED to mind-model@2 (RFC 0021 step 5). Back-compat only;
# never described as the current/canonical compiled-artifact IR.
legacy_dataflow_text   = "mic@2.1"
legacy_dataflow_binary = "MIC-B v2"
map_protocol = "1.0"

[autodiff]
# Reverse-mode AD ships in the open `mind` compiler for the Core v1 tensor ops.
mode   = "reverse-mode"
scope  = "Core v1 tensor ops"
entry  = "single-output main"
status = "shipped"
# Non-Core-v1 ops (functions / control flow / std-surface / modulo / bitwise / shift)
# return a structured error, NOT a silent zero gradient.
non_core_v1_policy = "structured error"
# Honesty guard: AD is NOT to be described as "experimental" (it ships + tests green),
# and NOT as "all ops complete" (it is scoped to Core v1, single-output main).

[runtime]
# The OPEN repo ships a reference CPU interpreter — correct but unoptimized, behind the
# `cpu-exec` feature. It is NOT "native"/production, and NOT unimplemented `todo!()`.
open_cpu = "reference interpreter"
# Production-grade CPU/GPU/accelerator backends live in the commercial mind-runtime.
production_backends = "commercial mind-runtime"

[profiles]
lightweight   = "open"
guarded       = "commercial"
high_assurance = "commercial"

# ---------------------------------------------------------------------------
# Phrases that must NEVER reappear on a public surface (regression guards).
# Each was a real contradiction fixed 2026-06-06; the gate fails if any returns.
[forbidden_phrases]
ir          = ["anchored on mic@1 trace hash", "mic@2 (Current)", "MIC-B v2 (Binary)"]
autodiff    = ["autodiff support is experimental", "autodiff is experimental"]
runtime     = ["Native CPU Execution"]
# The published cost figure is derived by scripts/check_claims.py from
# config/token_pricing.toml + the benchmark output. This entry is the belt to that
# braces: the specific hand-typed headline that rode green for months, back-solved
# to a $0.030/1K token price stated in no file while the cited methodology said $396.
cost_headline = ["saves $6,780", "saves $396/year"]
# Signing (RFC 0016 Phase C: Ed25519/ML-DSA) is SHIPPED but opt-in and off by
# default — an unsigned evidence chain is tamper-evident, not signed (release-CI
# auto-signing is the one remaining deferred leg). A 2026-07-09
# doc fix saying so was reverted the same day and silently never re-landed for
# 11 days (README claimed "signed" while SECURITY.md, two files away, correctly
# said "tamper-evident... signing is never enabled by default"). Never again.
evidence    = ["signed evidence chain"]
# Mindcraft (RFC 0007) audit, 2026-07-21: README.md documented a standalone
# `mindc lint` subcommand with worked example invocations that have never
# existed — `mindc --help` lists no `lint` subcommand; lint only runs
# embedded inside `mindc check`. Fixed in README.md/STATUS.md/CHANGELOG.md
# and disclosed in docs/rfcs/0007-mindcraft.md §0 alongside the
# self-hosted-front-end and `.mind`-rule-file claims (those two are NOT
# forbidden-phrase-gated: the RFC body intentionally preserves the original
# design-intent wording as historical record with a correction callout
# above it, so a literal-substring gate would trip on the RFC itself).
mindcraft   = ["mindc lint src/", "mindc lint --rule"]

# ---------------------------------------------------------------------------
# Auto-derived counts (OPTIONAL gate, conservative + advisory).
#
# Each entry declares a number that appears in a public surface AND how to
# re-derive the real value from the working tree. `scripts/check_claims.py`
# attempts the derivation; if the source path is unreachable it SKIPS that
# entry silently (never crashes a checkout without the tree). A `floor`
# declared number must stay <= the real count (the surface uses "N+"); an
# `exact` number must match within `tolerance`. Drift is FLAGGED.
#
# Modes (manifest `declared` vs the tree):
#   floor  — declared <= derived            (surface phrased as "N+")
#   exact  — |declared - derived| <= tolerance
# Kinds:
#   glob_count    — files matching `pattern` under `path`
#   regex_count   — occurrences of `regex` across files matching `pattern`
#   py_test_count — `def test_*` functions under `path` (pytest discovery)
#
# SECOND LEG — the number PRINTED on the surface (`surface_regex`, opt-in):
#   The fields above compare a number in THIS FILE against the tree. They never
#   read the docs, so the two drifted freely: README said "~1,390 tests across
#   174 test files" against a tree of 2,217 tests in 325 files while
#   `[PASS] floor 156+ <= 325` printed on every run, and the note below quoted
#   README text that had not existed for months. An entry that declares
#   `surface_regex` (exactly ONE capture group) has the number the regex finds
#   on `surface` compared to the DERIVED count, every occurrence:
#     surface_mode = "floor" — typed must not EXCEED derived, and must not lag
#                              it by more than `surface_tolerance` (the lag
#                              bound is what stops a floor going stale)
#     surface_mode = "exact" — |typed - derived| <= `surface_tolerance`
#   Fail-CLOSED: a missing surface, a regex matching nothing, or a non-numeric
#   capture is DRIFT, never a skip.
#
# Keep this section conservative: only declare counts a maintainer is willing
# to have block a commit. Floor + tolerance keep the false-positive rate low.
[counts.rust_test_files]
declared          = 378
mode              = "floor"
# Ratchet bound: `declared` may sit at most this far below the tree before the
# gate demands it be raised. A floor that is never re-raised turns its slack
# into deletable corpus — this entry declared 156 while tests/ held 325.
floor_tolerance   = 25
kind              = "glob_count"
globs             = ["tests/**/*.rs"]
surface           = "README.md"
surface_regex     = '([\d,]+)\+ test files'
surface_mode      = "floor"
surface_tolerance = 25
note              = 'floor over tests/**/*.rs (378 in the composed native-module bridge source tree); the README floor may lag the tree by at most 25 files before the gate demands a refresh.'

[counts.rust_test_fns]
declared          = 3083
mode              = "floor"
floor_tolerance   = 200
kind              = "regex_count"
globs             = ["tests/**/*.rs", "src/**/*.rs"]
regex             = '#\[(?:tokio::)?test\]'
surface           = "README.md"
surface_regex     = '([\d,]+)\+ tests\b'
surface_mode      = "floor"
surface_tolerance = 200
note              = 'floor over #[test] / #[tokio::test] across src/ + tests/ (recounted from the combined tree at the D4 deref-assign pointer-parity change: 3083); README prints "3,083+ tests" and may lag by at most 200.'

[counts.pytorch_bridge_tests]
declared          = 11
mode              = "exact"
tolerance         = 0
kind              = "py_test_count"
path              = "tools/pytorch_bridge/tests"
surface           = "README.md"
# Anchored on the PATH: README also says "17 unit tests under ..." about a
# different suite, and an unanchored pattern would compare that number to this
# count. A surface pattern must identify the claim, not just a number shape.
surface_regex     = '([\d,]+) unit tests under `tools/pytorch_bridge/tests/`'
surface_mode      = "exact"
surface_tolerance = 0
note              = '"11 unit tests under tools/pytorch_bridge/tests/" — exact, both in this manifest and on the surface.'

[counts.stdlib_modules]
# Raised 13 -> 42 (the tree): at 13 this floor let 29 of the 42 modules under
# std/ be deleted while the gate printed `[PASS] floor 13+ <= 42`. The floor is
# a TREE ratchet — it is not the historical "13 stdlib modules" release claim
# on the surface, which is why the two numbers differ (see the note below).
declared  = 42
mode      = "floor"
floor_tolerance = 4
kind      = "glob_count"
path      = "std"
pattern   = "*.mind"
surface   = "STATUS.md"
# deferred: no `surface_regex`. STATUS.md's "13 stdlib modules
# (vec/string/map/io/blas/toml/json/regex/net/fs/process/mlir/llvm)" is a
# HISTORICAL v0.7.0 release marker naming the modules that shipped in that
# release, not a live count of std/ (42 today) — raising it to the derived
# figure would falsify the release history. Upgrade path: split the sentence
# into the historical milestone and a live "std/ ships N+ modules" claim, then
# give the live one a surface_regex. check_claims.py prints a NOTE for this
# entry on every run so the gap stays visible.
note      = "floor over std/**/*.mind (42 today); the surface claim '13 stdlib modules' is the v0.7.0 release marker, not this count."
